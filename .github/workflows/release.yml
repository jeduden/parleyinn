name: Release

# Run from the Actions "Run workflow" button with a version like
# v0.1.0. A pushed tag is deliberately not the trigger: a tag is public
# the moment it exists, so a failed build would leave one pointing at
# binaries nobody can download. Here the version is validated and the
# suite run first, every binary is built and run once on its own
# platform (build.yml), and only then does the publish job create the
# tag, sign the checksums, attest the SBOM (ENG-20) and publish the
# release. The release build workflow, release-build.yml, attests the
# provenance (SLSA Build Level 3), and a last job verifies everything
# that was published.
#
# A release runs only from main. Every signature and attestation it
# makes names its workflow at the dispatched ref, and the verify job
# accepts only refs/heads/main, which only reviewed pull requests move
# (ENG-21). The tag cannot be that ref: it is created last, by publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0 (must start with v)"
        required: true
        type: string

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

# One release at a time, and never cancelled: stopping a run between
# the tag and the upload would leave a tag with no release on it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that can say no, before anything is built. The version
  # is read through the environment rather than interpolated into the
  # shell, so a crafted input cannot inject commands.
  preflight:
    runs-on: ubuntu-latest
    if: github.repository == 'jeduden/parleyinn'
    steps:
      - name: Validate the version
        run: |
          if ! printf '%s' "$VERSION" |
            grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version must look like v0.1.0, got: $VERSION"
            exit 1
          fi
      - name: Refuse any ref but main
        # ENG-20: the verify job pins every signer to refs/heads/main,
        # so a release from another ref would publish and then fail it.
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a release runs from main only, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: rust
          cache: false
      # CI already ran this on main, but main may have moved since.
      # Run it again against the commit actually released.
      # No cache anywhere in this workflow: a cache is writable by any
      # branch, and a release must not build from something a branch
      # could have poisoned.
      # ENG-30: the license check reads only the sources cargo has
      # already fetched, for every release target.
      - run: cargo fetch --locked
      # The NFR-02 rows time the release core (testkit::release_core_executable),
      # so it is built first; it is a test fixture here, never released.
      - run: cargo build --release --locked -p parinn -p calibrate
      - run: cargo test --workspace --locked

  # Every target built, by the same build.yml CI runs on every change,
  # inside the release build workflow, whose attest job signs the
  # provenance (ENG-20). The attestation's signer is that reusable
  # workflow, not this one. Its attest job is the only one to use the
  # two write permissions; a caller has to grant what a called job
  # asks.
  build:
    needs: preflight
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'jeduden/parleyinn'
    permissions:
      # contents to create the tag and the release; id-token for the
      # keyless Sigstore signature and the SBOM attestation;
      # attestations to store it. Only this job holds any of them.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned release tools with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "aqua:anchore/syft aqua:sigstore/cosign"
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-parinn"
          path: dist
          merge-multiple: true
      - name: Generate the SPDX SBOM
        # ENG-20: an SPDX SBOM of the Cargo workspace the binaries were
        # built from, read from Cargo.lock. syft is pinned, never
        # "latest".
        run: syft . --output spdx-json=dist/parinn.spdx.json
      - name: Create checksums
        # The SBOM is listed too, so the signed checksums cover it.
        working-directory: dist
        run: sha256sum parinn-* parinn.spdx.json > checksums.txt
      - name: Attest the SBOM
        # Ties the SBOM to each binary's SHA-256, signed through
        # Sigstore. The build provenance is release-build.yml's.
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/parinn-*"
          sbom-path: dist/parinn.spdx.json
      - name: Sign the checksum file
        # Keyless: the GitHub OIDC token binds the signature to this
        # workflow file at this ref. The bundle carries signature and
        # certificate. Verify with the command in SECURITY.md.
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: cosign sign-blob --bundle checksums.txt.sigstore.json checksums.txt
      - name: Publish the release
        # gh is already on the runner, so a third-party action holding
        # contents: write buys nothing. The tag is created here, on the
        # dispatched commit, only now that everything above succeeded.
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            parinn-* parinn.spdx.json checksums.txt checksums.txt.sigstore.json

  # ENG-20: checks the release as published, not the files this run
  # built. It downloads the release's own assets and verifies the
  # checksum bundle, each binary's build provenance (signed by
  # release-build.yml) and each binary's SBOM attestation (signed by
  # the publish job). Each signer is pinned to its exact certificate
  # identity at refs/heads/main, and the source to that ref and to the
  # commit this run tagged, so an attestation a branch made does not
  # pass. A red run here means a release nobody should trust.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    if: github.repository == 'jeduden/parleyinn'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned cosign with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:sigstore/cosign
          cache: false
      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir release
      - name: Verify the checksums
        working-directory: release
        run: |
          sha256sum --check checksums.txt
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity https://github.com/jeduden/parleyinn/.github/workflows/release.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
      - name: Verify each binary's provenance and SBOM
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for bin in parinn-*; do
            gh attestation verify "$bin" --repo jeduden/parleyinn \
              --cert-identity https://github.com/jeduden/parleyinn/.github/workflows/release-build.yml@refs/heads/main \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1
            gh attestation verify "$bin" --repo jeduden/parleyinn \
              --cert-identity https://github.com/jeduden/parleyinn/.github/workflows/release.yml@refs/heads/main \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --predicate-type https://spdx.dev/Document/v2.3
          done

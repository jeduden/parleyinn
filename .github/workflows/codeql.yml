name: CodeQL

# CodeQL code scanning, configured in the repository rather than by
# GitHub's default setup, so that .github/codeql/codeql-config.yml can
# leave the tests out. The tests hold fixed keys, nonces and commitment
# keys on purpose, to stay deterministic, and default setup flagged
# each one as a hard-coded cryptographic value (jeduden/parleyinn#48).
# Product code is scanned as before, for the same languages and on the
# same events. Default setup must be off in the repository's settings:
# GitHub refuses this workflow's results while it is on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, as default setup ran, so a new query reaches unchanged
    # code too.
    - cron: "27 4 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Read the workflow run's own status, which the action reports.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build Go for CodeQL
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

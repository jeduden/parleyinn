name: Build

# The release build of the core executable (ENG-01, CON-02), defined
# once: CI runs it on every change and the release workflow runs it
# before anything is published. Every target is built once, with the
# Rust release rust-toolchain.toml pins: the Linux targets link with
# the rust-lld Rust ships, the Windows target with mingw-w64 on the
# same Linux builder, and the darwin target with the runner's own
# Apple linker. Each binary then runs once on its own platform.
on:
  workflow_call:
    inputs:
      version:
        description: "The version stamped into the executable, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  # The release targets, as rust-target:artifact-name. The Linux
  # targets are musl, which links statically (CON-02).
  LINUX_TARGETS: >-
    x86_64-unknown-linux-musl:linux-amd64
    aarch64-unknown-linux-musl:linux-arm64
    x86_64-pc-windows-gnu:windows-amd64
  DARWIN_TARGETS: >-
    aarch64-apple-darwin:darwin-arm64
  # ENG-01: mingw-w64, exact, from Ubuntu 24.04's release pocket, which
  # never changes.
  MINGW: >-
    gcc-mingw-w64-x86-64-win32=13.2.0-6ubuntu1+26.1
    binutils-mingw-w64-x86-64=2.41.90.20240122-1ubuntu1+11.4
    mingw-w64-x86-64-dev=11.0.1-3build1
  # ENG-01: the C compiler the musl targets compile SQLite with
  # (ADR-2610110553), exact, from Ubuntu 24.04's release pocket.
  CLANG: clang-18=1:18.1.3-1ubuntu1
  # The musl release whose headers both musl targets compile SQLite
  # against, checked against its SHA-256 before use.
  MUSL_VERSION: 1.2.4
  MUSL_SHA256: 7a35eae33d5372a7c0da1188de798726f68825513b7ae3ebe97aaaa52114f039
  # The Ubuntu source package of that release, for the Launchpad mirror.
  MUSL_UBUNTU: 1.2.4-2

jobs:
  # One job per release target, each under the same budget; the target
  # is read from the *_TARGETS lists above, their one source. A target
  # that runs on its builder is checked there; the others run once
  # below, on their own platform.
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { builder: ubuntu-24.04, os: linux, name: linux-amd64, runs: true }
          - { builder: ubuntu-24.04, os: linux, name: linux-arm64, runs: false }
          - { builder: ubuntu-24.04, os: linux, name: windows-amd64, runs: false }
          - { builder: macos-15, os: darwin, name: darwin-arm64, runs: true }
    runs-on: ${{ matrix.builder }}
    timeout-minutes: 5
    env:
      OS: ${{ matrix.os }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: rust
          # Release builds must never consume a branch-writable cache.
          cache: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Pick this job's target from the lists
        run: |
          if [ "$OS" = linux ]; then all="$LINUX_TARGETS"; else all="$DARWIN_TARGETS"; fi
          # shellcheck disable=SC2086 # the list is space-separated pairs
          target=$(printf '%s\n' $all | sed -n "s/:$NAME\$//p")
          test -n "$target"
          echo "TARGET=$target" >> "$GITHUB_ENV"
          echo "TARGETS=$target:$NAME" >> "$GITHUB_ENV"
      # Worst case 151 s, bounded to 150 s by scripts/apt-install.sh;
      # the step's 3 minutes sit above it.
      - name: Install mingw-w64
        if: matrix.name == 'windows-amd64'
        timeout-minutes: 3
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ env.MINGW }}
          # Release builds never consume a branch-writable cache.
          cache: ${{ github.event_name != 'workflow_dispatch' }}
      # Worst case 151 s, bounded to 150 s by scripts/apt-install.sh;
      # the step's 3 minutes sit above it. With the musl step below, the
      # job's network steps take at most about 221 s, inside its cap.
      - name: Install clang
        if: matrix.os == 'linux' && matrix.name != 'windows-amd64'
        timeout-minutes: 3
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ env.CLANG }}
          cache: ${{ github.event_name != 'workflow_dispatch' }}
      # The musl target's headers, from one checked release, in a tree
      # of its own: musl generates its per-architecture headers in
      # place, so a tree serves one target. Worst case of the download:
      # 3 hosts x 20 s + 3 pauses x 2 s = 66 s; checking, unpacking and
      # installing the headers take seconds, under the step's 2 minutes.
      # The release archive, kept by its checksum so a build does not
      # depend on any one host once a download succeeded. A cached
      # archive is checked against MUSL_SHA256 like a downloaded one, and
      # release builds never consume a branch-writable cache.
      - name: Cache the musl release
        if: >-
          matrix.os == 'linux' && matrix.name != 'windows-amd64'
          && github.event_name != 'workflow_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/musl.tar.gz
          key: musl-${{ env.MUSL_VERSION }}-${{ env.MUSL_SHA256 }}
      - name: Install the musl target's headers
        if: matrix.os == 'linux' && matrix.name != 'windows-amd64'
        timeout-minutes: 2
        run: |
          archive="$RUNNER_TEMP/musl.tar.gz"
          if [ -f "$archive" ]; then
            echo "musl $MUSL_VERSION from the cache"
          else
            # The same archive from three hosts, one try each, over TLS
            # only, redirects included: Ubuntu's source package is
            # byte-identical to the release, and any host is transport
            # only, since the checksum below decides.
            pool="ubuntu/pool/universe/m/musl/musl_$MUSL_VERSION.orig.tar.gz"
            for url in "https://archive.ubuntu.com/$pool" \
                       "https://launchpad.net/ubuntu/+archive/primary/+sourcefiles/musl/$MUSL_UBUNTU/musl_$MUSL_VERSION.orig.tar.gz" \
                       "https://musl.libc.org/releases/musl-$MUSL_VERSION.tar.gz"; do
              if curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
                  --connect-timeout 10 --max-time 20 -o "$archive" "$url"; then
                break
              fi
              echo "::warning::could not download musl $MUSL_VERSION from $url"
              rm -f "$archive"
              sleep 2
            done
            test -f "$archive" || {
              echo "::error::could not download musl $MUSL_VERSION from any host (archive.ubuntu.com, launchpad.net, musl.libc.org)"
              exit 1
            }
          fi
          echo "$MUSL_SHA256  $archive" | sha256sum -c -
          arch="${TARGET%%-*}"
          src="$RUNNER_TEMP/musl-src-$arch"
          mkdir "$src"
          tar -xzf "$archive" -C "$src"
          make -s -C "$src/musl-$MUSL_VERSION" ARCH="$arch" prefix="$RUNNER_TEMP/musl-$arch" install-headers
          echo "MUSL_HEADERS=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install the pinned Rust targets
        run: |
          for pair in $TARGETS; do rustup target add "${pair%%:*}"; done
      - name: Build
        env:
          # ENG-01: the version and the commit, stamped into the
          # executable; `parinn version --json` reads both back.
          PARINN_VERSION: ${{ inputs.version }}
          PARINN_COMMIT: ${{ github.sha }}
        # ENG-01: the path prefixes keep the builder's paths out of the
        # binary. rust-lld links musl statically (CON-02); clang compiles
        # SQLite for each musl target against that target's headers and
        # its own builtin ones.
        run: |
          base="--remap-path-prefix=$PWD=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          mkdir dist
          for pair in $TARGETS; do
            target="${pair%%:*}"
            exe=""
            case "$target" in
              *-linux-musl)
                extra="-Clinker=rust-lld"
                arch="${target%%-*}"
                var="$(echo "$target" | tr - _)"
                export "CC_$var=clang-18"
                export "CFLAGS_$var=--target=$arch-linux-musl -nostdinc -isystem $(clang-18 -print-resource-dir)/include -isystem $MUSL_HEADERS/musl-$arch/include"
                ;;
              *-windows-gnu) extra="-Clinker=x86_64-w64-mingw32-gcc-win32"; exe=".exe" ;;
              *) extra="" ;;
            esac
            RUSTFLAGS="$base $extra" cargo build --locked --release -p parinn --bin parinn --target "$target"
            cp "target/$target/release/parinn$exe" "dist/parinn-${pair#*:}$exe"
          done
          (cd dist && shasum -a 256 parinn-*)
      - name: Check the binary reports what it was stamped with
        if: matrix.runs
        env:
          BIN: dist/parinn-${{ matrix.name }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/check-stamp.sh "$BIN" "$VERSION" "$COMMIT"
      # ENG-31: the license files regenerated from the lockfile are what
      # each executable must print on its own platform. The command also
      # fails the build when a committed file differs from them.
      - name: Regenerate the license files
        run: |
          cargo fetch --locked
          cargo run --locked -p engineering --bin license-check -- --out "$RUNNER_TEMP/regenerated"
      - name: Check the binary prints the regenerated licenses
        if: matrix.runs
        run: scripts/check-licenses.sh "dist/parinn-$NAME" "$RUNNER_TEMP/regenerated/licenses/$TARGET/THIRD_PARTY_LICENSES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-parinn
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-licenses
          path: ${{ runner.temp }}/regenerated/licenses/${{ env.TARGET }}/

  # The linux/arm64 executable is built on the x86_64 Linux builder; it
  # runs once here, on the platform it is for.
  linux-arm64:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64-parinn
          path: dist
      - name: Check the binary reports what it was stamped with
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          chmod +x dist/parinn-linux-arm64
          scripts/check-stamp.sh dist/parinn-linux-arm64 "$VERSION" "$COMMIT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64-licenses
          path: regenerated
      - name: Check the binary prints the regenerated licenses
        run: scripts/check-licenses.sh dist/parinn-linux-arm64 regenerated/THIRD_PARTY_LICENSES

  # The Windows executable is built on Linux; it runs once here, on the
  # platform it is for.
  windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-amd64-parinn
          path: dist
      - name: Check the binary reports what it was stamped with
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/check-stamp.sh dist/parinn-windows-amd64.exe "$VERSION" "$COMMIT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-amd64-licenses
          path: regenerated
      - name: Check the binary prints the regenerated licenses
        shell: bash
        run: scripts/check-licenses.sh dist/parinn-windows-amd64.exe regenerated/THIRD_PARTY_LICENSES

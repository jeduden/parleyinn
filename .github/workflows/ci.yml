name: CI

# The same gate the repository runs locally, run again where it cannot
# be skipped. Nothing here is new policy: CLAUDE.md's build commands
# are the source, and a job that drifts from them is the bug.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review too: the review workflow skips drafts and runs
    # after CI, so marking a pull request ready must rerun CI.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run moot; a
# push to main always finishes, so every main commit has a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # mise reads rust-toolchain.toml (ENG-01) and mise.lock; each job
  # installs only its tools, with a cache key that includes the pins.
  #
  # Every unit and integration test, and every scenario through
  # cucumber-rs. Pending scenarios are skipped and counted, so the
  # backlog is visible in every run.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes, and a checkout that leaves a token in
          # .git/config hands one to every later step.
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust"
          cache: true
      # ENG-12: the end-to-end suite starts the core in a user and
      # network namespace of its own, under strace, and fails on any
      # socket. The runner's AppArmor refuses unprivileged user
      # namespaces, and its image may lack strace. A runner that still
      # cannot confine fails the end-to-end tests, never skips them.
      - name: Let the end-to-end suite confine the core
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v strace >/dev/null || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
          }
      # ENG-30: the license check reads only the sources cargo has
      # already fetched, for every release target.
      - run: cargo fetch --locked
      # NFR-02: the scenario that holds a hook handler to its budget
      # times the release build of the core, never the development
      # build (testkit::release_core_executable), against the frozen
      # calibration workload (testkit::calibrate_executable). Built once
      # here, with the real HOME, before the suite; no cache, as in
      # release.yml.
      - name: Build the release core the budget rows time
        run: cargo build --release --locked -p parinn -p calibrate
      # ENG-14: the suite runs with HOME pointed at an empty decoy
      # directory, the toolchain keeping its own homes. The isolation
      # guard (testkit::guard) aborts a test that resolves real
      # state. The decoy catches a test that writes under the user's
      # HOME without going through the guard: a trace left under it
      # fails the job. A read, or a write through a path built before
      # HOME was swapped, leaves none; the guard and the
      # one-resolver gate test carry those.
      - name: Run the tests with a decoy HOME
        run: |
          decoy="$RUNNER_TEMP/decoy-home"
          mkdir "$decoy"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          HOME="$decoy" cargo test --workspace --locked
          if [ -n "$(ls -A "$decoy")" ]; then
            echo "::error::a test left files under the real HOME"
            ls -lA "$decoy"
            exit 1
          fi
      # The pending backlog, counted. A measurement, not a gate.
      - name: Count scenarios
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test --locked --quiet -p scenario --test bdd |
            grep '^scenarios:' | tee -a "$GITHUB_STEP_SUMMARY"

  # ENG-11: line coverage per test layer (unit, integration,
  # end-to-end) and per crate, held to the floors in Cargo.toml's
  # [workspace.metadata.coverage]. The table lands in the job summary,
  # and Codecov receives one flag per test layer.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token Codecov exchanges for an upload grant, below.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust github:taiki-e/cargo-llvm-cov"
          cache: true
      # ENG-12: the end-to-end suite starts the core in a user and
      # network namespace of its own, under strace, and fails on any
      # socket. The runner's AppArmor refuses unprivileged user
      # namespaces, and its image may lack strace. A runner that still
      # cannot confine fails the end-to-end tests, never skips them.
      - name: Let the end-to-end suite confine the core
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v strace >/dev/null || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
          }
      # ENG-30: the license check reads only the sources cargo has
      # already fetched, for every release target.
      - run: cargo fetch --locked
      # NFR-02: the budget rows time the release core, which the
      # instrumented run does not build.
      - run: cargo build --release --locked -p parinn -p calibrate
      - run: cargo run --locked -p coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: target/coverage/
      # OIDC over a stored token: the runner mints a short-lived
      # identity that Codecov exchanges for an upload grant, so no
      # secret sits in this repository's settings. A fork PR has no
      # id-token, so the steps are skipped rather than failing.
      - name: Upload unit coverage to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/coverage/unit.lcov
          flags: unit
          # Only the named file: the uploader's search would sweep up
          # the other test layers' lcov beside it under this flag.
          disable_search: true
          fail_ci_if_error: false
      - name: Upload integration coverage to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/coverage/integration.lcov
          flags: integration
          # Only the named file: the uploader's search would sweep up
          # the other test layers' lcov beside it under this flag.
          disable_search: true
          fail_ci_if_error: false
      - name: Upload end-to-end coverage to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/coverage/e2e.lcov
          flags: e2e
          # Only the named file: the uploader's search would sweep up
          # the other test layers' lcov beside it under this flag.
          disable_search: true
          fail_ci_if_error: false

  # ENG-09: Miri runs the tests of the platform shim, the one crate with
  # unsafe code, over its fake of DPAPI, on the exact dated nightly
  # ENG-01 pins for Miri here. The Windows and macOS key stores
  # (ADR-2610171300) then build for their own targets, which a Linux
  # runner can check but not run.
  miri:
    runs-on: ubuntu-latest
    env:
      MIRI_NIGHTLY: nightly-2026-10-16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly with Miri
        run: >-
          rustup toolchain install "$MIRI_NIGHTLY"
          --profile minimal --component miri,rust-src --no-self-update
      - run: cargo "+$MIRI_NIGHTLY" miri test -p platform --locked
      - name: Install the pinned Rust toolchain with the Windows and macOS targets
        run: >-
          rustup toolchain install
          "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          --profile minimal --component clippy,rustfmt,llvm-tools-preview
          --target x86_64-pc-windows-gnu,aarch64-apple-darwin
          --no-self-update
      - run: cargo check -p key -p platform --all-targets --locked --target x86_64-pc-windows-gnu
      - run: cargo check -p key --all-targets --locked --target aarch64-apple-darwin

  # ENG-16: clippy with warnings denied, and rustfmt's layout.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust"
          cache: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ENG-16: cargo-deny holds every crate in the tree to ENG-18's
  # license allow-list (deny.toml names the exceptions), to crates.io
  # and to no wildcard; cargo-audit refuses a crate with a known
  # vulnerability.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust github:EmbarkStudios/cargo-deny github:rustsec/rustsec"
          cache: true
      - run: cargo fetch --locked
      - run: cargo deny check licenses bans sources
      # The fuzz workspace has its own manifest and lockfile (ENG-07),
      # so the same policy reads them too.
      - run: cargo deny --manifest-path fuzz/Cargo.toml check licenses bans sources
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock
      # ENG-30: every crate a release links carries a license text that
      # fits its declared license, so a dependency with none stops the
      # pull request that adds it.
      - run: cargo run --locked -p engineering --bin license-check

  # ENG-27: every check that keeps the specification, its scenarios
  # and the repository's records in step is proven here. The suite
  # injects each registered drift into a copy of the checkout and fails
  # when the check it names lets the drift through. It needs mdsmith and
  # taplo on PATH, so it runs here rather than in `cargo test --workspace`.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust github:jeduden/mdsmith aqua:tamasfe/taplo"
          cache: true
      # ENG-12: the end-to-end suite starts the core in a user and
      # network namespace of its own, under strace, and fails on any
      # socket. The runner's AppArmor refuses unprivileged user
      # namespaces, and its image may lack strace. A runner that still
      # cannot confine fails the end-to-end tests, never skips them.
      - name: Let the end-to-end suite confine the core
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v strace >/dev/null || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
          }
      # ENG-30: the license check reads only the sources cargo has
      # already fetched, for every release target.
      - run: cargo fetch --locked
      - run: cargo test --locked -p drift --test suite -- --ignored

  # ENG-15: the benchmark gate. The base is the head's first parent:
  # the main a pull request's merge commit sits on, or main before a
  # push. Both sides' suites run on this one runner, interleaved round
  # by round and alternating which side goes first, so a drift in the
  # runner's speed lands on both alike. The head's gate then fails
  # naming each benchmark whose median is more than 10% slower with
  # significance (one-sided Mann-Whitney U, alpha 0.01). The suite
  # times the core's start-up today, a second or two of sampling after
  # two small release builds, so it gates every pull request rather
  # than waiting for the nightly job.
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROUNDS: 30
      SAMPLES: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The head and its first parent, the base.
          fetch-depth: 2
      - name: Check out the base beside the head
        run: git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
      - name: Install the head's pinned Rust with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: rust
          cache: true
      # The base predates mise.toml when this change first lands, so
      # read its own Rust pin from rust-toolchain.toml.
      - name: Install the pinned Rust toolchains
        shell: bash
        run: |
          base_version="$(sed -n 's/^channel = "\(.*\)"$/\1/p' "$RUNNER_TEMP/base/rust-toolchain.toml")"
          mise install "rust@$base_version"
      - name: Build the head's suite and core
        run: cargo build --release --locked -p benchmark -p parinn
      # Until the suite reaches main, the base has none to build.
      - name: Build the base's suite and core
        shell: bash
        run: |
          cd "$RUNNER_TEMP/base"
          if [ -f tooling/benchmark/Cargo.toml ]; then
            cargo build --release --locked -p benchmark -p parinn
          fi
      - name: Sample both sides and gate
        shell: bash
        run: |
          set -euo pipefail
          head="$GITHUB_WORKSPACE/target/release"
          base="$RUNNER_TEMP/base/target/release"
          out="$RUNNER_TEMP/samples"
          mkdir -p "$out"
          if [ ! -x "$base/benchmark" ]; then
            "$head/benchmark" run --core "$head/parinn" --samples "$SAMPLES" > "$out/head.samples"
            msg="the base has no benchmark suite to compare with; the head's suite ran"
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for round in $(seq "$ROUNDS"); do
            order="base head"
            [ $((round % 2)) -eq 0 ] && order="head base"
            for side in $order; do
              bin="$head"
              [ "$side" = base ] && bin="$base"
              core="$bin/parinn"
              # Only the base side is taken again: it runs main's
              # benchmark, which fails a round when a stalled disk
              # overruns the hook budget twice. The head's benchmark
              # retries inside the round, and a head round that fails
              # fails the gate.
              tries=1
              [ "$side" = base ] && tries=3
              for try in $(seq "$tries"); do
                if "$bin/benchmark" run --core "$core" --samples "$SAMPLES" \
                  > "$out/round.samples" 2> "$out/round.err"; then
                  cat "$out/round.samples" >> "$out/$side.samples"
                  break
                fi
                cat "$out/round.err" >&2
                if [ "$try" -eq "$tries" ] || ! grep -q "overran its hook budget" "$out/round.err"; then
                  exit 1
                fi
                sleep 2
              done
            done
          done
          status=0
          # A regression the head's record accepts, and the base's does
          # not yet, passes as accepted (ENG-15).
          "$head/benchmark" gate --base "$out/base.samples" --head "$out/head.samples" \
            --accepted "$GITHUB_WORKSPACE/tooling/benchmark/accepted.txt" \
            --accepted-on-base "$RUNNER_TEMP/base/tooling/benchmark/accepted.txt" \
            > "$out/report.md" 2> "$out/failures.txt" || status=$?
          tee -a "$GITHUB_STEP_SUMMARY" < "$out/report.md"
          while IFS= read -r line; do
            echo "::error title=benchmark gate::${line#benchmark: }"
          done < "$out/failures.txt"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: benchmark-samples
          path: ${{ runner.temp }}/samples/

  # CON-02: the release build, on every change and not first on
  # release day. Every target is built and run once on its own
  # platform. It is granted nothing to sign with: only the release
  # workflow's release-build.yml attests build provenance (ENG-20).
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      version: v0.0.0-ci

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "github:jeduden/mdsmith"
          cache: true
      - run: mdsmith check .

  # TOML files: Taplo holds each to the layout .taplo.toml sets, and
  # every Cargo.toml to Schema Store's Cargo schema, committed under
  # .taplo/schemas so the lint reads no network. Cargo only warns on a
  # misspelt manifest key; this refuses it.
  toml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust aqua:tamasfe/taplo"
          cache: true
      - run: taplo fmt --check
      - run: taplo lint

  # Workflows are an attack surface no compiler reads. zizmor checks
  # them for an unpinned action, a token left in a checkout, an input
  # interpolated into a shell.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "aqua:zizmorcore/zizmor"
          cache: true
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github

  # The one check the branch and release-tag rulesets require (main's is
  # committed as .github/rulesets/main.json, ENG-21). GitHub
  # names a required check after a job, never after the workflow, so
  # this job carries the name "CI" and passes only when every job above
  # passed. A job added later joins `needs:` here and the rulesets stay
  # as they are. `always()` keeps it running after a failure, so a red
  # job turns this check red instead of leaving it skipped, which a
  # ruleset would not count as a failure.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [test, coverage, lint, supply-chain, drift, benchmark, build, markdown, toml, workflows, miri]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a CI job ended $r"; exit 1; }
          done

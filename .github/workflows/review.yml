name: Review

# ENG-21 and ENG-28: agents review each pull request once its CI
# passes, and the reviewer app posts the outcome. Main's review-bundle
# tool reads main's tree and the pull request's, writes the bundle the
# agents read first, sets the review's class and dispatches the
# specialists and generalists the change needs; main's review-run then
# runs each as its own agent and writes the review outcome: code routes
# the review, no agent does. A separate job, the only one that holds the
# app's key, decides with the review-gate crate what review to post.
#
# `workflow_run` and `issue_comment` both run this file as main
# defines it, never as the pull request under review does, so no
# branch can rewrite its own reviewer. The pull request's tree is
# checked out beside main's as data; nothing from it runs. A comment
# brings a review because consent is a comment: a CODEOWNERS owner's
# comment on a pull request whose CI passed reviews it again.
on: # zizmor: ignore[dangerous-triggers] main's definition runs by design; the pull request's tree is only read
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created]

permissions: {}

# A newer CI run for the same branch makes an older review moot, and a
# newer comment on the same pull request an older comment's review. A
# comment that brings no review (an agent's, or one from outside the
# repository) takes a group of its own, so it cancels nothing.
concurrency:
  group: >-
    review-${{ github.event.workflow_run.head_branch ||
    (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
    !contains(github.event.comment.body, '_Generated by [Claude Code]') &&
    format('pull-{0}', github.event.issue.number)) || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # Only a pull request from a branch of this repository, and only
    # once its CI passed. A fork's run is never reviewed here, and nor
    # is a draft: CI reruns when a pull request is marked ready, and
    # that run brings the review. A comment counts only on a pull
    # request, from someone with a hand in the repository, and not from
    # an agent; the first step narrows that to a CODEOWNERS owner.
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      !contains(github.event.comment.body, '_Generated by [Claude Code]'))
    runs-on: ubuntu-latest
    # The worst case, not the usual one (agents end in minutes): the
    # repository has 56 specialists, review-run starts 32 at once, so
    # they take two waves and the generalists a third; each agent may
    # run twice, 900 seconds a run: 3 x 2 x 15 = 90 minutes, and the
    # setup before them.
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pull: ${{ steps.pull_head.outputs.number }}
      head_sha: ${{ steps.pull_head.outputs.head_sha }}
      outcome: ${{ steps.outcome.outputs.outcome }}
      checked: ${{ steps.bundle.outputs.checked }}
      dispatch: ${{ steps.bundle.outputs.dispatch }}
      consulted: ${{ steps.outcome.outputs.consulted }}
      eval_plan: ${{ steps.plan.outputs.eval_plan }}
    steps:
      # Main's checkout comes first, for the scripts it holds. The agent
      # works in it, so it follows main's protocol and main's CLAUDE.md,
      # never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pull request and the head to review. After CI, the head CI
      # ran on. After a comment, the pull request's head, once its CI
      # passed there and if it was committed before the comment (the
      # time-of-check guard a comment trigger needs; the post job checks
      # the head again), and only for a comment a CODEOWNERS owner in main
      # wrote, not one an agent posted through the owner's account,
      # which ends with the Claude Code attribution line. The comment is
      # read from the event file, never spliced into the script.
      - name: Find the pull request, unless it is a draft
        id: pull_head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: scripts/review-find-pull.sh
      - if: steps.pull_head.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pull_head.outputs.head_sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false
      - name: Write the pull request's diff against main
        if: steps.pull_head.outputs.number != ''
        env:
          HEAD_SHA: ${{ steps.pull_head.outputs.head_sha }}
        run: git -C pr-head diff "origin/main...$HEAD_SHA" > pr.diff
      # A change to a CODEOWNERS path needs the stakeholder's consent
      # (ENG-21), in a comment or review on the pull request: only what an
      # owner in main's CODEOWNERS wrote is kept, never a comment ending
      # with the Claude Code attribution line an agent posts.
      - name: Collect the stakeholder's comments
        if: steps.pull_head.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ steps.pull_head.outputs.number }}
        run: scripts/review-collect-comments.sh
      # The release rust-toolchain.toml names, so the tool builds as CI
      # tested it: main's tool, from main's tree; the pull request is input.
      - name: Install pinned Rust and mdsmith with mise
        if: steps.pull_head.outputs.number != ''
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust github:jeduden/mdsmith"
          # Jobs handling review credentials never restore executable caches.
          cache: false
      # The review class, how deep the review goes, from the changed paths
      # (ENG-28), and the dispatch, the specialists review-run runs and
      # the generalists that weigh their findings; what the bundle printed
      # stays in class.txt, where review-run reads the class.
      - name: Bundle what the change touches
        id: bundle
        if: steps.pull_head.outputs.number != ''
        run: scripts/review-bundle.sh
      # The reviewer components the pull request changes (ENG-32), planned
      # here with main's tool; the evaluate job runs their cases.
      - name: Plan the reviewer evaluation
        id: plan
        if: steps.pull_head.outputs.number != ''
        run: scripts/review-plan.sh
      # The pull request's agent instructions are data to review, never
      # instructions to load: every one, at any depth of its tree, leaves
      # it and is copied, each file under its path, into one text file,
      # review/pr-instructions.txt. No file named as an instruction file
      # stays under either directory the agent is given, where a nested
      # CLAUDE.md or .claude/ loads when the agent reads beside it.
      - name: Keep the pull request's instructions out of the agent's load path
        if: steps.pull_head.outputs.number != ''
        run: scripts/review-isolate-instructions.sh
      - name: Install the pinned Claude Code command line
        if: steps.pull_head.outputs.number != ''
        uses: ./.github/actions/claude-code
      # Built, its crates fetched and their build scripts run, before the
      # Claude token is in any step's environment; the Review step runs
      # it offline.
      - name: Build review-run
        if: steps.pull_head.outputs.number != ''
        run: cargo build --locked --quiet -p review-run
      # The previous review's findings: only main's review workflow's artifacts.
      - name: Fetch the previous review's findings
        id: previous
        if: steps.pull_head.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ steps.pull_head.outputs.number }}
        run: scripts/review-previous.sh
      - name: Fetch what the pull request's reviews spent
        id: spend
        if: steps.pull_head.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ steps.pull_head.outputs.number }}
        run: scripts/review-spend.sh
      # The Claude token reaches no agent's environment and no file its
      # tools can read (ENG-28). This step alone holds it, in a credentials
      # file only its owner reads, under the runner's temporary directory,
      # outside both trees the agents are given; review-run refuses each
      # agent every read there, of /proc, /sys and /dev, and outside its trees.
      - name: Stage the Claude token where no agent reads it
        if: steps.pull_head.outputs.number != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cargo run --locked --quiet --offline -p review-eval -- stage-credential \
            --dir "$RUNNER_TEMP/claude-credential"
      # review-run starts each dispatched specialist, and each generalist
      # once its own specialists ended, as `claude --agent` from main's
      # definition: read tools alone, the pull request's tree as data, a
      # 900-second deadline each, a run only while its tier's cap fits the
      # pull request's (ENG-28; ADR-2610300031). No agent gets a GitHub
      # token, and no step that runs one holds the Claude token: review-run
      # reads it from the staged credential only to scrub what it writes
      # and prints, and a review whose agent's output held it requests
      # changes and fails. It writes review/outcome.json and the rest; an
      # exit other than 0 says it could not run. Billed to the stakeholder.
      - name: Review
        id: review
        if: steps.pull_head.outputs.number != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.file }}
          SPENT: ${{ steps.spend.outputs.spent }}
        run: |
          cargo run --locked --quiet --offline -p review-run -- --workdir . --parallel 32 \
            --credential "$RUNNER_TEMP/claude-credential" --spent-before "$SPENT" \
            ${PREVIOUS:+--previous "$PREVIOUS"} > review/run.txt
      # Whatever review-run wrote is scrubbed of the token once more, a
      # run cut off before its own scrub included, before any step reads
      # or uploads it; a form found fails the job. Then the credential goes.
      - name: Scrub what the review wrote of the Claude token
        id: scrub
        if: always() && steps.pull_head.outputs.number != ''
        run: |
          set +e
          cargo run --locked --quiet --offline -p review-eval -- scrub \
            --credential "$RUNNER_TEMP/claude-credential" \
            --path review/logs --path review/reports --path review/answers.json \
            --path review/usage.json --path review/outcome.json --path review/consulted.json \
            --path review/gaps.json --path review/not-reviewed.md --path review/run-id.json \
            --path review/findings.json --path review/findings.md --path review/spend.json \
            --path review/run.txt --path review/agent-runs.jsonl --path review/report.html
          code=$?
          set -e
          rm -rf "$RUNNER_TEMP/claude-credential"
          if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
            echo "scrubbed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$code" -eq 3 ]; then
            echo "::error::what the review wrote held the Claude Code OAuth token, now redacted; revoke and rotate it, and nothing is posted"
          fi
          exit "$code"
      # A review that could not run says why in the job summary (failed=<reason>).
      - name: Say why the review could not run
        if: failure() && steps.review.outcome == 'failure'
        run: scripts/review-say-why.sh
      # The outcome review-run wrote, for the post job's gate, and the
      # agents that answered, which the gate holds to the dispatch: a
      # review that left a dispatched agent out fails (ENG-28).
      - name: Read the review outcome and the agents consulted
        id: outcome
        if: steps.pull_head.outputs.number != ''
        # Each file is read into a variable first, so one jq cannot read
        # fails the step here instead of passing an empty output on.
        run: scripts/review-read-outcome.sh
      # What the review cost, per agent, as review-run read it from each
      # run's log: calls, tokens, parts, attempts and cost. It only
      # reports and never fails the review.
      - name: Record what the review cost
        if: always() && steps.pull_head.outputs.number != ''
        run: scripts/review-record-cost.sh
      # The run list review-run wrote, failed or not, on one screen; it and
      # review/report.html go with the reports below, holding timings,
      # tokens, costs and gap reasons, never a tool result (ENG-28). It
      # only reports and never fails the review.
      - name: Summarize the review's run list
        if: always() && steps.pull_head.outputs.number != ''
        run: scripts/review-run-list-summary.sh
      # The reports and the answers, for the post job's gate and the
      # review's readers. A review that failed keeps what it wrote too,
      # so its author can read why.
      - name: Keep the specialists' reports
        if: always() && steps.scrub.outputs.scrubbed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-reports
          path: |
            review/reports/
            review/answers.json
            review/report.html
            review/agent-runs.jsonl
            review/usage.json
          if-no-files-found: error
      # This review's findings, per pull request, for its next review.
      - name: Keep the tracked findings for the next review
        if: always() && steps.review.outcome == 'success' && steps.scrub.outputs.scrubbed == 'true' && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-findings-pr-${{ steps.pull_head.outputs.number }}
          path: |
            review/findings.json
            review/findings.md
          retention-days: 90
          if-no-files-found: error
      # What this review spent, however it ended, per attempt, for the next to sum.
      - name: Keep what this review spent
        if: always() && steps.scrub.outputs.scrubbed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-spend-pr-${{ steps.pull_head.outputs.number }}-a${{ github.run_attempt }}
          path: review/spend.json
          retention-days: 90
          if-no-files-found: warn
      # The run logs under review/logs/ stay in the job: they hold every
      # tool result an agent read, scrubbed of the token but whatever
      # else it read (ENG-28).

  evaluate:
    # The cases of each reviewer component the pull request changes, run
    # on the model its front matter names from the pull request's
    # definition of it (ENG-32). It runs after the review, from main's
    # definition, with the token the review has and nothing it can write
    # with; the post job's gate weighs its findings beside the bundle's.
    # With nothing to evaluate it writes an empty finding list and ends
    # in seconds, so the post job always finds its artifact.
    needs: review
    if: needs.review.outputs.pull != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # Main's checkout comes first, for the scripts it holds and, when
      # a component changed, the tree the fixture worlds are worktrees of.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the plan
        id: plan
        env:
          EVAL_PLAN: ${{ needs.review.outputs.eval_plan }}
        run: scripts/review-eval-read-plan.sh
      - name: Record that no component changed
        if: steps.plan.outputs.empty == 'true'
        run: scripts/review-eval-none.sh
      # The pull request's tree holds the components and cases under
      # evaluation, read as data: the harness runs each component inside
      # a world of its own, never from this directory.
      - if: steps.plan.outputs.empty == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.review.outputs.head_sha }}
          path: pr-head
          persist-credentials: false
      - name: Install pinned Rust and mdsmith with mise
        if: steps.plan.outputs.empty == 'false'
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust github:jeduden/mdsmith"
          # Jobs handling review credentials never restore executable caches.
          cache: false
      - name: Install the pinned Claude Code command line
        if: steps.plan.outputs.empty == 'false'
        uses: ./.github/actions/claude-code
      # Built, its crates fetched and their build scripts run, before the
      # Claude token is in any step's environment.
      - name: Build review-eval
        if: steps.plan.outputs.empty == 'false'
        run: cargo build --locked --quiet -p review-eval
      # As in the review: this step alone holds the Claude token, and
      # stages it where no agent reads it (ENG-28).
      - name: Stage the Claude token where no agent reads it
        if: steps.plan.outputs.empty == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cargo run --locked --quiet --offline -p review-eval -- stage-credential \
            --dir "$RUNNER_TEMP/claude-credential"
      # Exit 1 says a case failed: its blocking finding reaches the gate
      # through findings.json, so the review requests changes and names
      # the case. Exit 3 says an agent's output held the token, and any
      # other exit is the harness's own failure: either fails the job, so
      # nothing is posted and the red run says why.
      - name: Run the cases of each changed component
        id: cases
        if: steps.plan.outputs.empty == 'false'
        env:
          EVAL_PLAN: ${{ needs.review.outputs.eval_plan }}
        run: scripts/review-eval-run-cases.sh
      # What the evaluation wrote is scrubbed of the token once more
      # before the summary reads it or the upload keeps it; a form found
      # fails the job.
      - name: Scrub what the evaluation wrote of the Claude token
        id: scrub
        if: always() && steps.plan.outputs.empty == 'false'
        run: |
          set +e
          cargo run --locked --quiet -p review-eval -- scrub \
            --credential "$RUNNER_TEMP/claude-credential" --path review-eval
          code=$?
          set -e
          rm -rf "$RUNNER_TEMP/claude-credential"
          if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
            echo "scrubbed=true" >> "$GITHUB_OUTPUT"
            if [ -f review-eval/report.md ]; then
              cat review-eval/report.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$code"
      # The findings for the gate, the report, the scorecard and each
      # run's grade and report; the run logs stay in the job.
      - name: Keep the evaluation
        if: always() && (steps.plan.outputs.empty == 'true' || steps.scrub.outputs.scrubbed == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-evaluation
          path: |
            review-eval/
            !review-eval/runs/**/log.jsonl
            !review-eval/runs/**/log.stderr
          if-no-files-found: error

  post:
    # Runs only after the review and the evaluation succeeded: a failed
    # or missing review posts nothing, and the red run says why.
    needs: [review, evaluate]
    if: needs.review.outputs.pull != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml names, so the gate builds as CI
      # tested it.
      - name: Install pinned Rust with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: rust
          # Jobs handling review credentials never restore executable caches.
          cache: false
      # Built, its crates fetched and their build scripts run, before the
      # app's token exists; the decide step below runs it offline.
      - name: Build the review gate
        run: cargo build --locked --quiet -p review-gate
      # The app's token, scoped to this repository and to what posting
      # a review and its check needs. With no `repositories` input the action scopes it
      # to the repository the workflow runs in, so a rename of the
      # repository cannot break the mint. A missing key fails the step,
      # and the job.
      - name: Mint the reviewer app's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lie5LIUdOU49SrG9
          private-key: ${{ secrets.JEDUDEN_REVIEW_AGENT_KEY }}
          permission-pull-requests: write
          permission-checks: write
      - name: Read the head and its checks
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ needs.review.outputs.pull }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
        run: scripts/review-read-head.sh
      # The specialists' reports and the agents' answers, as reports/ and
      # answers.json, for the gate to check against each other.
      - name: Take the specialists' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-reports
          path: .
      # The reviewer evaluation's findings, one per failed case, which
      # the gate weighs as deterministic findings (ENG-32).
      - name: Take the reviewer evaluation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-evaluation
          path: evaluation
      # The deterministic findings weigh beside the agent's: a blocking
      # one withholds approval whatever the agent's verdict. A gate that
      # fails to decide posts the review-gate check failed, naming this
      # run, so the required check never sits waiting with no reason; a
      # failed check is no approval.
      - name: Decide the review
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ needs.review.outputs.outcome }}
          CHECKED: ${{ needs.review.outputs.checked }}
          DISPATCH: ${{ needs.review.outputs.dispatch }}
          CONSULTED: ${{ needs.review.outputs.consulted }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
        run: scripts/review-decide.sh
      - name: Post the review
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ needs.review.outputs.pull }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          REPORTS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/review-post.sh
      # The decision again as the review-gate check on the reviewed head,
      # which main's ruleset takes from this app alone (ENG-21): it
      # passes only on an approval, so no other approval stands in for
      # the gate's. A gate that posted no review, for a head that moved,
      # posts no check here.
      - name: Post the review-gate check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          REPORTS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/review-post-check.sh

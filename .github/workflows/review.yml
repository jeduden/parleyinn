name: Review

# ENG-21 and ENG-28: agents review each pull request once its CI
# passes, and the reviewer app posts the outcome. Before the agents
# run, main's review-bundle tool reads main's tree and the pull
# request's: it writes the review bundle of touched requirement rows,
# scenarios and invariants the agents read first, sets the review's
# class by what changed, dispatches the specialists and generalists the
# change needs, and makes the findings no agent is needed for (a live
# scenario put back on @pending, ENG-29's record). Main's review-run
# tool then runs every dispatched specialist, then every generalist,
# each as its own agent, and writes the review outcome from what they
# answered: code routes the review, no agent does. A separate job, the
# only one that holds the app's key, decides with the review-gate crate
# what review to post: an approval only for an approving verdict with
# no blocking finding, on the head the agents read, with CI green there.
#
# `workflow_run` and `issue_comment` both run this file as main
# defines it, never as the pull request under review does, so no
# branch can rewrite its own reviewer. The pull request's tree is
# checked out beside main's as data the agent reads; nothing from it
# runs. A comment brings a review because consent is a comment: a
# CODEOWNERS owner's comment on a pull request whose CI passed reviews
# it again, now that the consent is there to read.
on: # zizmor: ignore[dangerous-triggers] main's definition runs by design; the pull request's tree is only read
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created]

permissions: {}

# A newer CI run for the same branch makes an older review moot, and a
# newer comment on the same pull request an older comment's review. A
# comment that brings no review (an agent's, or one from outside the
# repository) takes a group of its own, so it cancels nothing.
concurrency:
  group: >-
    review-${{ github.event.workflow_run.head_branch ||
    (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
    !contains(github.event.comment.body, '_Generated by [Claude Code]') &&
    format('pull-{0}', github.event.issue.number)) || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # Only a pull request from a branch of this repository, and only
    # once its CI passed. A fork's run is never reviewed here, and nor
    # is a draft: CI reruns when a pull request is marked ready, and
    # that run brings the review. A comment counts only on a pull
    # request, from someone with a hand in the repository, and not from
    # an agent; the first step narrows that to a CODEOWNERS owner.
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      !contains(github.event.comment.body, '_Generated by [Claude Code]'))
    runs-on: ubuntu-latest
    # The worst case, not the usual one (agents end in minutes): the
    # repository has 56 specialists, review-run starts 32 at once, so
    # they take two waves and the generalists a third; each agent may
    # run twice, 900 seconds a run: 3 x 2 x 15 = 90 minutes, and the
    # setup before them.
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull: ${{ steps.pull_head.outputs.number }}
      head_sha: ${{ steps.pull_head.outputs.head_sha }}
      outcome: ${{ steps.outcome.outputs.outcome }}
      checked: ${{ steps.bundle.outputs.checked }}
      dispatch: ${{ steps.bundle.outputs.dispatch }}
      consulted: ${{ steps.outcome.outputs.consulted }}
      eval_plan: ${{ steps.plan.outputs.eval_plan }}
    steps:
      # The pull request and the head to review. After CI, the head CI
      # ran on. After a comment, the pull request's head, once its CI
      # passed there and if it was committed before the comment (the
      # time-of-check guard a comment trigger needs; the post job checks
      # the head again), and only for a comment a CODEOWNERS owner in main
      # wrote, not one an agent posted through the owner's account,
      # which ends with the Claude Code attribution line. The comment is
      # read from the event file, never spliced into the script.
      - name: Find the pull request, unless it is a draft
        id: pull_head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = issue_comment ]; then
            author=$(jq -r .comment.user.login "$GITHUB_EVENT_PATH")
            owners=$(gh api "repos/$REPO/contents/.github/CODEOWNERS" \
              -H 'Accept: application/vnd.github.raw' | grep -v '^#' \
              | grep -oE '@[A-Za-z0-9-]+(/[A-Za-z0-9_.-]+)?' | grep -v / | tr -d @ | sort -u)
            if ! printf '%s\n' "$owners" | grep -qxF "$author"; then
              echo "::notice::$author is no CODEOWNERS owner; nothing to review"
              exit 0
            fi
            if jq -e '.comment.body | split("\n") | map(select(test("\\S"))) | last // ""
              | test("^_Generated by \\[Claude Code\\]")' "$GITHUB_EVENT_PATH" > /dev/null; then
              echo "::notice::an agent's comment brings no review"
              exit 0
            fi
            pull=$(jq -r .issue.number "$GITHUB_EVENT_PATH")
            head=$(gh api "repos/$REPO/pulls/$pull" --jq \
              'select(.state == "open" and .draft == false and .head.repo.full_name == env.REPO) | .head.sha')
            if [ -z "$head" ]; then
              echo "::notice::pull request $pull is not open and ready from this repository; nothing to review"
              exit 0
            fi
            # The comment must come after the head it brings a review
            # of: a head committed later is not what the owner saw.
            commit_at=$(gh api "repos/$REPO/commits/$head" --jq .commit.committer.date)
            comment_at=$(jq -r .comment.created_at "$GITHUB_EVENT_PATH")
            if [[ $(date -d "$commit_at" +%s) -gt $(date -d "$comment_at" +%s) ]]; then
              echo "::notice::$head was committed after the comment; its CI run brings the review"
              exit 0
            fi
            passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request" \
              --jq '.workflow_runs | sort_by(.created_at) | last | .conclusion // empty')
            if [ "$passed" != success ]; then
              echo "::notice::CI has not passed on $head; its run brings the review"
              exit 0
            fi
          else
            head=$RUN_HEAD
          fi
          number=$(HEAD_SHA=$head gh api "repos/$REPO/commits/$head/pulls" \
            --jq '[.[] | select(.state == "open" and .draft == false and .head.sha == env.HEAD_SHA)][0].number // empty')
          if [ -z "$number" ]; then
            echo "::notice::no open, ready pull request has head $head; nothing to review"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"
      # The agent works in main's checkout, so it follows main's
      # protocol and main's CLAUDE.md, never the pull request's.
      - if: steps.pull_head.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.pull_head.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pull_head.outputs.head_sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false
      - name: Write the pull request's diff against main
        if: steps.pull_head.outputs.number != ''
        env:
          HEAD_SHA: ${{ steps.pull_head.outputs.head_sha }}
        run: git -C pr-head diff "origin/main...$HEAD_SHA" > pr.diff
      # A change to a CODEOWNERS path needs the stakeholder's consent
      # (ENG-21), given in a comment or review on the pull request.
      # Only what an owner in main's CODEOWNERS wrote is kept. A
      # comment an agent posted through the owner's account ends with
      # the Claude Code attribution line, and it is dropped.
      - name: Collect the stakeholder's comments
        if: steps.pull_head.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ steps.pull_head.outputs.number }}
        run: |
          owners=$(grep -v '^#' .github/CODEOWNERS \
            | grep -oE '@[A-Za-z0-9-]+(/[A-Za-z0-9_.-]+)?' | grep -v / \
            | tr -d @ | sort -u | jq -R . | jq -sc .)
          {
            gh api --paginate "repos/$REPO/issues/$PULL/comments" \
              --jq '.[] | {author: .user.login, at: .created_at, body}'
            gh api --paginate "repos/$REPO/pulls/$PULL/reviews" \
              --jq '.[] | {author: .user.login, at: .submitted_at, body, state}'
          } | jq -s --argjson owners "$owners" '[.[]
            | select(.author as $a | $owners | index($a))
            | select((.body // "") | test("\\S"))
            | select((.body | split("\n") | map(select(test("\\S"))) | last)
                | test("^_Generated by \\[Claude Code\\]") | not)]' \
            > stakeholder-comments.json
      # The release rust-toolchain.toml names, so the tool builds as CI
      # tested it. It is main's tool, built from main's tree; the pull
      # request's tree is only its input.
      - name: Install pinned Rust and mdsmith with mise
        if: steps.pull_head.outputs.number != ''
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust github:jeduden/mdsmith"
          # Jobs handling review credentials never restore executable caches.
          cache: false
      # The review class sets how deep the review goes, from the paths that
      # changed: light for Markdown no stakeholder path holds, deep for
      # any path CODEOWNERS assigns and for the gates' code, the reach
      # tests and the security-sensitive crates, standard otherwise. The
      # dispatch names the specialists review-run runs and the
      # generalists that weigh their findings. What the bundle printed
      # stays in class.txt, where review-run reads the class.
      - name: Bundle what the change touches
        id: bundle
        if: steps.pull_head.outputs.number != ''
        run: |
          # Each specialist writes its report here; the generalists read
          # it, and the gate checks it against the agent's answer.
          mkdir -p review/reports
          # mdsmith's own catalog of the Markdown patterns its rules cannot
          # see until a kind, include or catalog declares them, from main's
          # pinned mdsmith; the Markdown specialist reviews against it.
          mdsmith help patterns -f json > review/mdsmith-patterns.json
          cargo run --locked --quiet -p review-bundle -- --base . --head pr-head \
            --diff pr.diff --consent stakeholder-comments.json --out review > class.txt
          cat class.txt >> "$GITHUB_OUTPUT"
          {
            echo "checked=$(jq -c . review/checked.json)"
            echo "dispatch=$(jq -c . review/dispatch.json)"
          } >> "$GITHUB_OUTPUT"
          cat class.txt "review/checked.json" >> "$GITHUB_STEP_SUMMARY"
      # The reviewer components the pull request changes, each with its
      # reason (ENG-32): the evaluate job below runs their cases. The
      # plan is computed here, from the two trees, with main's tool, and
      # the evaluate job reads it as data.
      - name: Plan the reviewer evaluation
        id: plan
        if: steps.pull_head.outputs.number != ''
        run: |
          cargo run --locked --quiet -p review-eval -- plan --base . --head pr-head \
            --out review/eval-plan.json
          echo "eval_plan=$(jq -c . review/eval-plan.json)" >> "$GITHUB_OUTPUT"
      # The pull request's agent instructions are data to review, never
      # instructions to load: every one, at any depth of its tree, leaves
      # it and is copied, each file under its path, into one text file,
      # review/pr-instructions.txt. No file named as an instruction file
      # stays under either directory the agent is given, where a nested
      # CLAUDE.md or .claude/ loads when the agent reads beside it.
      - name: Keep the pull request's instructions out of the agent's load path
        if: steps.pull_head.outputs.number != ''
        run: |
          find pr-head -path pr-head/.git -prune -o \( -name .claude -o -name CLAUDE.md \
            -o -name CLAUDE.local.md -o -name AGENTS.md -o -name .mcp.json \) -prune -print0 \
            > instructions.list
          while IFS= read -r -d '' f; do
            find "$f" -type f -print0 | while IFS= read -r -d '' g; do
              printf '\n===== %s =====\n' "${g#pr-head/}"
              cat "$g"
            done
            rm -rf "$f"
          done < instructions.list > review/pr-instructions.txt
      - name: Install the pinned Claude Code command line
        if: steps.pull_head.outputs.number != ''
        uses: ./.github/actions/claude-code
      # Built, its crates fetched and their build scripts run, before the
      # Claude token is in any step's environment; the Review step runs
      # it offline.
      - name: Build review-run
        if: steps.pull_head.outputs.number != ''
        run: cargo build --locked --quiet -p review-run
      # review-run starts each dispatched specialist, then each
      # generalist once every specialist ended, as `claude --agent` from
      # main's definition of it: read tools, writes to review/reports
      # alone for a specialist and none for a generalist, no Bash, the
      # pull request's tree added as data, each with a 900-second
      # deadline. No agent gets a GitHub token: the step's environment
      # adds the Claude token and nothing else. It writes
      # review/outcome.json, review/consulted.json (every agent that
      # answered), review/answers.json and review/usage.json, with each
      # run's log under review/logs/. An exit other than 0 says it could
      # not run, and the job fails, so nothing is posted.
      # It runs on the stakeholder's Claude subscription, through the
      # token `claude setup-token` prints, so a review has no per-model-token
      # bill; it counts against the plan's usage limits instead.
      - name: Review
        if: steps.pull_head.outputs.number != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cargo run --locked --quiet --offline -p review-run -- --workdir . --parallel 32 \
            > review/run.txt
      # The outcome review-run wrote, for the post job's gate, and the
      # agents that answered, which the gate holds to the dispatch: a
      # review that left a dispatched agent out fails (ENG-28).
      - name: Read the review outcome and the agents consulted
        id: outcome
        if: steps.pull_head.outputs.number != ''
        run: |
          {
            echo "outcome=$(jq -c . review/outcome.json)"
            echo "consulted=$(jq -c . review/consulted.json)"
          } >> "$GITHUB_OUTPUT"
          {
            cat review/run.txt
            echo "consulted: $(jq -c . review/consulted.json)"
          } >> "$GITHUB_STEP_SUMMARY"
      # What the review cost, per agent, as review-run read it from each
      # run's log: its model calls, fresh input, cache writes and reads,
      # output, the attempts it took (two when its first run did not
      # answer) and the cost its result reported. A review that recorded
      # none reports nothing; this step only reports and never fails the
      # review.
      - name: Record what the review cost
        if: always() && steps.pull_head.outputs.number != ''
        run: |
          [ -s review/usage.json ] || exit 0
          cost=$(jq '[.[].cost_usd] | add // 0' review/usage.json || echo unknown)
          {
            echo "### What the review cost: \$$cost"
            echo
            echo "| agent | attempts | calls | fresh in | cache write | cache read | out | cost |"
            echo "|---|---:|---:|---:|---:|---:|---:|---:|"
            jq -r '.[] | "| \(.agent) | \(.attempts) | \(.calls) | \(.fresh) | \(.cache_write) | \(.cache_read) | \(.output) | \(.cost_usd) |"' \
              review/usage.json
          } >> "$GITHUB_STEP_SUMMARY" || exit 0
      # The reports and the answers, for the post job's gate and for the
      # review's readers: the review and its check link here.
      - name: Keep the specialists' reports
        if: steps.pull_head.outputs.number != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-reports
          path: |
            review/reports/
            review/answers.json
            review/usage.json
          if-no-files-found: error
      # The run logs under review/logs/ stay in the job: they hold every
      # tool result an agent read, its environment's token among what it
      # can read (ENG-28).

  evaluate:
    # The cases of each reviewer component the pull request changes, run
    # on the model its front matter names from the pull request's
    # definition of it (ENG-32). It runs after the review, from main's
    # definition, with the token the review has and nothing it can write
    # with; the post job's gate weighs its findings beside the bundle's.
    # With nothing to evaluate it writes an empty finding list and ends
    # in seconds, so the post job always finds its artifact.
    needs: review
    if: needs.review.outputs.pull != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Read the plan
        id: plan
        env:
          EVAL_PLAN: ${{ needs.review.outputs.eval_plan }}
        run: |
          if [ "$(printf '%s' "$EVAL_PLAN" | jq 'length')" = 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Record that no component changed
        if: steps.plan.outputs.empty == 'true'
        run: |
          mkdir -p review-eval
          echo '[]' > review-eval/findings.json
          echo "No reviewer component changed; nothing was evaluated." > review-eval/report.md
      # Main's tree is the checkout the fixture worlds are worktrees of;
      # the pull request's tree holds the components and cases under
      # evaluation, read as data: the harness runs each component inside
      # a world of its own, never from this directory.
      - if: steps.plan.outputs.empty == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.plan.outputs.empty == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.review.outputs.head_sha }}
          path: pr-head
          persist-credentials: false
      - name: Install pinned Rust and mdsmith with mise
        if: steps.plan.outputs.empty == 'false'
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust github:jeduden/mdsmith"
          # Jobs handling review credentials never restore executable caches.
          cache: false
      - name: Install the pinned Claude Code command line
        if: steps.plan.outputs.empty == 'false'
        uses: ./.github/actions/claude-code
      # Exit 1 says a case failed: its blocking finding reaches the gate
      # through findings.json, so the review requests changes and names
      # the case. Any other exit is the harness's own failure and fails
      # the job, so nothing is posted and the red run says why.
      - name: Run the cases of each changed component
        if: steps.plan.outputs.empty == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EVAL_PLAN: ${{ needs.review.outputs.eval_plan }}
        run: |
          mkdir -p review-eval
          printf '%s' "$EVAL_PLAN" > eval-plan.json
          set +e
          cargo run --locked --quiet -p review-eval -- run --checkout . --tree pr-head \
            --cases pr-head/tooling/review-eval/cases --base-cases tooling/review-eval/cases \
            --plan eval-plan.json --out review-eval --parallel 12
          code=$?
          set -e
          cat review-eval/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -gt 1 ]; then
            echo "::error::the reviewer evaluation did not run to its end (exit $code)"
            exit "$code"
          fi
      # The findings for the gate, the report, the scorecard and each
      # run's grade and report; the run logs stay in the job.
      - name: Keep the evaluation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-evaluation
          path: |
            review-eval/
            !review-eval/runs/**/log.jsonl
            !review-eval/runs/**/log.stderr
          if-no-files-found: error

  post:
    # Runs only after the review and the evaluation succeeded: a failed
    # or missing review posts nothing, and the red run says why.
    needs: [review, evaluate]
    if: needs.review.outputs.pull != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release rust-toolchain.toml names, so the gate builds as CI
      # tested it.
      - name: Install pinned Rust with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: rust
          # Jobs handling review credentials never restore executable caches.
          cache: false
      # Built, its crates fetched and their build scripts run, before the
      # app's token exists; the decide step below runs it offline.
      - name: Build the review gate
        run: cargo build --locked --quiet -p review-gate
      # The app's token, scoped to this repository and to what posting
      # a review and its check needs. With no `repositories` input the action scopes it
      # to the repository the workflow runs in, so a rename of the
      # repository cannot break the mint. A missing key fails the step,
      # and the job.
      - name: Mint the reviewer app's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lie5LIUdOU49SrG9
          private-key: ${{ secrets.JEDUDEN_REVIEW_AGENT_KEY }}
          permission-pull-requests: write
          permission-checks: write
      - name: Read the head and its checks
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ needs.review.outputs.pull }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
        run: |
          gh api "repos/$REPO/pulls/$PULL" --jq .head.sha > head.txt
          gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | {id, name, status, conclusion, started_at, app: .app.id}' > check-runs.jsonl
      # The specialists' reports and the agents' answers, as reports/ and
      # answers.json, for the gate to check against each other.
      - name: Take the specialists' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-reports
          path: .
      # The reviewer evaluation's findings, one per failed case, which
      # the gate weighs as deterministic findings (ENG-32).
      - name: Take the reviewer evaluation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-evaluation
          path: evaluation
      # The deterministic findings weigh beside the agent's: a blocking
      # one withholds approval whatever the agent's verdict. A gate that
      # fails to decide posts the review-gate check failed, naming this
      # run, so the required check never sits waiting with no reason; a
      # failed check is no approval.
      - name: Decide the review
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ needs.review.outputs.outcome }}
          CHECKED: ${{ needs.review.outputs.checked }}
          DISPATCH: ${{ needs.review.outputs.dispatch }}
          CONSULTED: ${{ needs.review.outputs.consulted }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
        run: |
          printf '%s' "$OUTCOME" > outcome.json
          printf '%s' "$CHECKED" > bundle-checked.json
          jq -s 'add' bundle-checked.json evaluation/findings.json > checked.json
          printf '%s' "$DISPATCH" > dispatch.json
          printf '%s' "$CONSULTED" > consulted.json
          if ! cargo run --locked --quiet -p review-gate --offline -- --outcome outcome.json \
            --check-runs check-runs.jsonl --reviewed "$HEAD_SHA" --head "$(cat head.txt)" \
            --checked checked.json --dispatch dispatch.json \
            --consulted consulted.json --reports reports --answers answers.json > review.json; then
            gh api --method POST "repos/$REPO/check-runs" -f name=review-gate \
              -f head_sha="$HEAD_SHA" -f status=completed -f conclusion=failure \
              -f "output[title]=The review gate did not decide" \
              -f "output[summary]=The review gate failed before deciding; the log of $RUN says why."
            exit 1
          fi
      - name: Post the review
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ needs.review.outputs.pull }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          REPORTS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -s review.json ]; then
            jq --arg url "$REPORTS" '.body += "\n\nThe specialist reports: \($url) (artifact review-reports)."' \
              review.json > posted.json
            if ! gh api --method POST "repos/$REPO/pulls/$PULL/reviews" --input posted.json; then
              gh api --method POST "repos/$REPO/check-runs" -f name=review-gate \
                -f head_sha="$HEAD_SHA" -f status=completed -f conclusion=failure \
                -f "output[title]=The review gate could not post its review" \
                -f "output[summary]=Posting the review failed; the log of $REPORTS says why."
              exit 1
            fi
          fi
      # The decision again as the review-gate check on the reviewed head,
      # which main's ruleset takes from this app alone (ENG-21): it
      # passes only on an approval, so no other approval stands in for
      # the gate's. A gate that posted no review, for a head that moved,
      # posts no check here.
      - name: Post the review-gate check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          REPORTS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -s review.json ]; then
            conclusion=failure
            title="Changes requested"
            if [ "$(jq -r .event review.json)" = APPROVE ]; then
              conclusion=success
              title="Approved"
            fi
            gh api --method POST "repos/$REPO/check-runs" -f name=review-gate \
              -f head_sha="$HEAD_SHA" -f status=completed -f conclusion="$conclusion" \
              -f "output[title]=$title" \
              -f "output[summary]=The review gate's review on this head says why. The specialists' reports: $REPORTS (artifact review-reports)."
          fi

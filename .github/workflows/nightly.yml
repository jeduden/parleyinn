name: Nightly

# The long-running gates that do not fit a pull request's budget:
# coverage-guided fuzzing (ENG-07), the crash-consistency harness
# (ENG-06), the concurrency soak (ENG-09) and the live Claude Code run
# (ENG-17), each as its plan lands. It also checks main's branch
# protection (ENG-21), which is a setting no pull request can change.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ENG-01: the exact dated nightly fuzz/rust-toolchain.toml pins,
      # and cargo-fuzz at an exact version.
      - name: Install the pinned nightly and cargo-fuzz
        shell: bash
        run: |
          rustup toolchain install \
            "$(sed -n 's/^channel = "\(.*\)"$/\1/p' fuzz/rust-toolchain.toml)" \
            --profile minimal --no-self-update
          cargo install --locked cargo-fuzz@0.13.2
      # ENG-07: cargo-fuzz runs every target under fuzz/, each for a
      # fixed time from its committed corpus. New inputs land in the
      # run's work directory, never in the committed corpus. A crash
      # fails the job after every target ran, and its input is kept.
      - name: Fuzz every target
        shell: bash
        run: |
          nightly="$(sed -n 's/^channel = "\(.*\)"$/\1/p' fuzz/rust-toolchain.toml)"
          status=0
          for target in $(cargo +"$nightly" fuzz list --fuzz-dir fuzz); do
            mkdir -p "fuzz-work/$target"
            cargo +"$nightly" fuzz run --fuzz-dir fuzz "$target" \
              "fuzz-work/$target" "fuzz/corpus/$target" \
              -- -max_total_time=900 -rss_limit_mb=2048 || status=1
            echo "fuzzed $target" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers
          path: fuzz/artifacts/

  # ENG-06: the crash-consistency test kills the built core with
  # SIGKILL at a random point of `parinn ingest`, 10,000 times, each
  # start confined (ENG-12), and fails unless `parinn verify` exits 0
  # after every kill. A failing iteration names the seed that replays
  # it; each night takes a new seed. Purge, migration and rebuild join
  # it as their phases land.
  crash-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install
          "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          --profile minimal --no-self-update
      # The confinement runs the core in a user and network namespace of
      # its own, under strace. A runner may restrict unprivileged user
      # namespaces, and its image may lack strace.
      - name: Allow the confinement
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v strace >/dev/null || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
          }
      - name: Kill ingest 10,000 times and verify after each kill
        env:
          PARINN_CRASH_ITERATIONS: "10000"
        run: |
          export PARINN_CRASH_SEED="$GITHUB_RUN_ID"
          echo "crash-consistency seed $PARINN_CRASH_SEED" | tee -a "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p parinn --test e2e_crash_consistency -- --nocapture

  # ENG-21: the rulesets, main's and the tag rulesets, are settings of
  # the repository on GitHub, not files, so they can weaken without a
  # pull request. The rulesets the repository commits under
  # .github/rulesets are the ones it wants; this job fetches each live
  # one by name and fails when one is missing or weaker. It reads with
  # the workflow's own token. GitHub shows a ruleset's bypass actors only
  # to a caller with write access to the ruleset, which this token never
  # has, so a bypass actor shows here only when the API reveals it. The
  # stakeholder applies the committed rulesets, and until they are
  # applied this job is red.
  protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: rust
          cache: true
      # Every committed ruleset, main's and the tag rulesets, against
      # the live one of the same name. A missing or weaker one fails the
      # job, after every ruleset was compared.
      - name: Compare every live ruleset with its committed one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/rulesets" > live-rulesets.json
          status=0
          for committed in .github/rulesets/*.json; do
            name="$(jq -r .name "$committed")"
            id="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' live-rulesets.json)"
            if [ -z "$id" ]; then
              echo "::error::the repository has no ruleset named $name"
              status=1
              continue
            fi
            gh api "repos/$GITHUB_REPOSITORY/rulesets/$id" > live.json
            cargo run --locked --quiet -p engineering --bin protection-check -- --committed "$committed" --live live.json || status=1
          done
          exit "$status"

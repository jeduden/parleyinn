name: Stability probe

# ENG-32: how stable the review is on an unchanged pull-request state.
# The `claude` command line takes no seed, so a review cannot be pinned,
# only measured by repetition: for each frozen state of the corpus,
# tooling/review-eval/stability-corpus.toml, main's review-run reviews
# it three times, each in a fresh work directory with nothing reused,
# and `review-report stability` compares the three: the share of runs
# whose verdict differs from the most common one (the flip rate) and,
# per agent, the overlap of its finding sets (Jaccard). A flip rate
# above 0.2 or an overlap below 0.7 (review-report's FLIP_RATE_LIMIT
# and JACCARD_FLOOR) is a warning, not a failure: the probe measures,
# the stakeholder decides.
#
# It runs from main's definition on the stakeholder's Claude token, as
# the review does, with nothing it can write with. One probe is nine
# reviews, about $15 of model usage, so it runs on demand alone.
on:
  workflow_dispatch:
  # The weekly probe, off until the stakeholder turns it on:
  # schedule:
  #   - cron: "23 4 * * 1"

permissions: {}

# One probe at a time: two would only double the cost.
concurrency:
  group: stability-probe
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      states: ${{ steps.corpus.outputs.states }}
      samples: ${{ steps.corpus.outputs.samples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust"
          cache: false
      - name: Read the corpus
        id: corpus
        run: |
          cargo run --locked --quiet -p review-report -- \
            corpus tooling/review-eval/stability-corpus.toml >> "$GITHUB_OUTPUT"

  # One fresh review of one state: main's tree as the work directory,
  # the state's head as the pull request's tree, its diff against its
  # base, and no answer from any other run.
  sample:
    needs: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.corpus.outputs.samples) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust and mdsmith with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust github:jeduden/mdsmith"
          # Jobs handling review credentials never restore executable caches.
          cache: false
      - name: Install the pinned Claude Code command line
        uses: ./.github/actions/claude-code
      # Built before the Claude token is in any step's environment.
      - name: Build the review's tools
        run: cargo build --locked --quiet -p review-bundle -p review-run
      # As the review workflow prepares its work directory, the pull
      # request's agent instructions copied out of its tree as data.
      - name: Prepare a fresh work directory
        env:
          BASE: ${{ matrix.base }}
          HEAD_SHA: ${{ matrix.head }}
        run: |
          work="$RUNNER_TEMP/work"
          mkdir -p "$work/pr-head"
          git archive HEAD | tar -x -C "$work"
          git archive "$HEAD_SHA" | tar -x -C "$work/pr-head"
          git diff "$BASE...$HEAD_SHA" > "$work/pr.diff"
          cd "$work"
          mkdir -p review/reports
          echo '[]' > stakeholder-comments.json
          find pr-head \( -name .claude -o -name CLAUDE.md -o -name CLAUDE.local.md \
            -o -name AGENTS.md -o -name .mcp.json \) -prune -print0 > instructions.list
          while IFS= read -r -d '' f; do
            find "$f" -type f -print0 | while IFS= read -r -d '' g; do
              printf '\n===== %s =====\n' "${g#pr-head/}"
              cat "$g"
            done
            rm -rf "$f"
          done < instructions.list > review/pr-instructions.txt
          mdsmith help patterns -f json > review/mdsmith-patterns.json
          "$GITHUB_WORKSPACE/target/debug/review-bundle" --base . --head pr-head \
            --diff pr.diff --consent stakeholder-comments.json --out review > class.txt
      - name: Review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEAD_SHA: ${{ matrix.head }}
        run: |
          "$GITHUB_WORKSPACE/target/debug/review-run" --workdir "$RUNNER_TEMP/work" \
            --parallel 32 --head-sha "$HEAD_SHA" > "$RUNNER_TEMP/work/review/run.txt"
      # What the comparison reads, and the trace and report page; the run
      # logs stay in the job, as in the review (ENG-28). A state's name
      # holds no underscore, so the comparison's pattern takes its own
      # three reviews alone.
      - name: Keep the review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review_${{ matrix.name }}_${{ matrix.sample }}
          path: |
            ${{ runner.temp }}/work/class.txt
            ${{ runner.temp }}/work/review/reports/
            ${{ runner.temp }}/work/review/outcome.json
            ${{ runner.temp }}/work/review/answers.json
            ${{ runner.temp }}/work/review/usage.json
            ${{ runner.temp }}/work/review/gaps.json
            ${{ runner.temp }}/work/review/run-id.json
            ${{ runner.temp }}/work/review/report.html
            ${{ runner.temp }}/work/review/trace.jsonl
          if-no-files-found: error

  # The three reviews of each state, compared.
  stability:
    needs: [corpus, sample]
    if: always() && needs.corpus.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.corpus.outputs.states) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust with mise
        uses: ./.github/actions/setup-mise
        with:
          tools: "rust"
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review_${{ matrix.name }}_*
          path: runs
      - name: Measure the stability
        id: measure
        run: |
          set -o pipefail
          cargo run --locked --quiet -p review-report -- stability --out stability.json \
            runs/*/ | tee measured.txt
          {
            echo "### Stability of the review"
            echo
            cat measured.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qx 'within_limits=false' measured.txt; then
            echo "::warning::the review is unstable on this state: a flip rate above 0.2 or a finding overlap below 0.7; stability.json names each agent"
          fi
      - name: Keep the measure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stability_${{ matrix.name }}
          path: stability.json
          if-no-files-found: error

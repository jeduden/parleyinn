name: Cache the drift build target
description: Keep the directory the drift suite builds into (DRIFT_TARGET_DIR, set by the job) between runs, so a shard does not compile every dependency
runs:
  using: composite
  steps:
    # Restored by every shard, saved when the job ends by one that
    # missed; a miss only costs the cold build, never a failure (I9).
    - name: Cache the drift build target
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.DRIFT_TARGET_DIR }}
        key: drift-target-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          drift-target-${{ runner.os }}-${{ runner.arch }}-

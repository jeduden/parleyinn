component = "review"
kind = "defect"
title = "a planted unwrap reaches the review outcome"

[[create]]
file = "tooling/review-bundle/src/rogue.rs"
content = '''
//! The first byte of a payload.

/// The first byte of `payload`.
#[must_use]
pub fn first(payload: &[u8]) -> u8 {
    *payload.first().unwrap()
}
'''

[[replace]]
file = "tooling/review-bundle/src/lib.rs"
old = "pub mod render;\n"
new = "pub mod render;\npub mod rogue;\n"

[expect]
outcome = ["request_changes"]

[[expect.finding]]
path = "tooling/review-bundle/src/rogue.rs"
severity = "blocking"
mentions = ["unwrap"]

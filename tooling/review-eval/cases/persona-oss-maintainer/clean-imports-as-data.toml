# Imported rooms as attributed, untrusted data

## Goal

An imported room keeps every event under the seat keys that signed it (I8); nothing in it restores to the maintainer's agents or reaches them unasked (I2). The maintainer's agent recalls the foreign room only through a recall tool, inside the untrusted-data envelope, marked with its origin. Secrets and private paths are redacted on import and the redaction is recorded (I1). A room whose log does not verify against its seat keys is refused and shown why. When the pull request merges, a landing link ties the contribution's room to the landed commit. A contributor needs no account and no service: a published room is a read-only bundle.

## Context

A maintainer has no reason to trust a stranger's history and every reason to keep it. The story of how a change was made is worth reading; it is never worth obeying.

## Tasks

1. Keep imported events under their seat keys, untrusted.
2. Recall foreign content only enveloped, with its origin.
3. Redact on import and record each redaction.
4. Refuse a room that does not verify; link a merged room to its landed commit.

## Acceptance Criteria

- Every imported event is attributed to the seat key that signed it and never restores to the maintainer's agents.
- The foreign room is readable only through a recall tool, inside the untrusted-data envelope, with its origin.
- A secret planted in a room is redacted on import with the redaction recorded; a room that does not verify is refused with the reason; a merged room is linked to its landed commit.

## Phases

1. Specification: the requirement rows and the `@pending` scenarios that
   carry each task above, reviewed by the domain-model agent; this plan
   then names the ids each phase closes.
2. Implementation: each scenario off `@pending`, red then green, one
   phase per task.

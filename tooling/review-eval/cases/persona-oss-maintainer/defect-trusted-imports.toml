# Imported rooms restore to the maintainer's agents

## Goal

When a maintainer imports the room a pull request came with, the room's pins join the maintainer's active pins and restore to the maintainer's agents after their next compaction, and its posts reach those agents as the owner's own posts do. The contributor's instructions to their agent thus carry over to the maintainer's review agent, which saves the maintainer from repeating them.

## Context

A contribution's room holds the instructions and decisions behind the change. A maintainer's review agent works better with that context in place than with the diff alone.

## Tasks

1. Merge an imported room's pins into the maintainer's active pins.
2. Deliver an imported room's posts to the maintainer's agents as the owner's.
3. Skip the untrusted-data envelope for imported content.
'''


# Evidence at landing

## Goal

A room shows the diff, the key moments behind it and, for each result, whether an own check, a witness check or a CI attested result verified it, each with its evidence. An agent's claim is shown as a claim. Approval happens once, on the forge, by a person who is not a commit author of the branch, and the room shows the forge's review state; required checks must be green. The landing link records the room id on the landed commit, through a squash or a merge queue, so the room is found again from the commit.

## Context

A reviewer accountable for what merges needs the evidence, not the narrative, in one place, with the merge gate respected.

## Tasks

1. Show what verified each result, with its evidence.
2. Approve only on the forge, never by a commit author or their agent.
3. Record the room id on the landed commit.

## Acceptance Criteria

- Each result in a room shows whether an own check, a witness check or a CI attested result verified it, with the evidence; an agent's unverified claim shows as a claim.
- The forge refuses an approval by a commit author of the branch or their agent, and the room shows the forge's review state.
- The landing link records the room id on the landed commit through a squash and through a merge queue.

## Requirements

The plan holds to REC-19, VIEW-08 and OWN-05, under I1 and I5. Phase 1 names
the rows it changes and the `@pending` scenarios it takes off.

## Phases

1. Specification: the requirement rows and the `@pending` scenarios that
   carry each task above, reviewed by the domain-model agent; this plan
   then names the ids each phase closes.
2. Implementation: each scenario off `@pending`, red then green, one
   phase per task.

# Room sync through a relay

## Goal

Every node sends its events to a hosted relay at relay.parleyinn.dev and reads other nodes' events from it. A developer signs in to the relay with an account; peers are the nodes under the same account. A node that cannot reach the relay queues its events and drops the queue after 24 hours, so an offline laptop never fills its disk.

## Context

Direct connections between a laptop, a home server and a cloud sandbox are hard to set up. A relay every node can dial out to removes the network setup.

## Tasks

1. Send and receive events through the relay.
2. Sign nodes in with an account.
3. Drop the undelivered queue after 24 hours.

## Acceptance Criteria

- Every event reaches other nodes through the relay only.
- A node signs in with an account before it syncs.
- An undelivered queue older than 24 hours is deleted.

## Requirements

The plan holds to PEER-06, SEC-25 and OWN-22, under I1, I4 and I10. Phase 1 names
the rows it changes and the `@pending` scenarios it takes off.

## Phases

1. Specification: the requirement rows and the `@pending` scenarios that
   carry each task above, reviewed by the domain-model agent; this plan
   then names the ids each phase closes.
2. Implementation: each scenario off `@pending`, red then green, one
   phase per task.
'''


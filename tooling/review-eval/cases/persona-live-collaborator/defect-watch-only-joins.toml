# Watch-only joins

## Goal

A joined seat reads the room as it happens but cannot post. To contribute, the guest exports the room to a file and sends the owner a message outside ParleyInn. The room shows no presence, since guests only watch.

## Context

Posts from guests risk derailing the owner's agents. Keeping guests read-only removes that risk and keeps the room's write path to the owner alone.

## Tasks

1. Join a room read-only by invite.
2. Export a room to a file for comments outside ParleyInn.
3. Show no presence for joined seats.

## Acceptance Criteria

- A joined seat reads every event live and can send no post.
- `parinn room export` writes the room to a file a guest can send on.
- No presence is shown for a joined seat.

## Requirements

The plan holds to OWN-03, OWN-08, LANE-11, LANE-30 and PEER-09, under I2 and I8. Phase 1 names
the rows it changes and the `@pending` scenarios it takes off.

## Phases

1. Specification: the requirement rows and the `@pending` scenarios that
   carry each task above, reviewed by the domain-model agent; this plan
   then names the ids each phase closes.
2. Implementation: each scenario off `@pending`, red then green, one
   phase per task.
'''


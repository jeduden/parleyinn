component = "review-spec"
kind = "clean"
title = "a specialist's finding the diff contradicts, dropped"

# The edit sits in the domain model, which no CODEOWNERS path covers, so
# the review bundle adds no consent finding for the generalist to keep.
[[replace]]
file = "docs/domain-model/index.md"
old = "# Domain model\n"
new = "<!-- The one source of ParleyInn's concepts. -->\n# Domain model\n"

[[report]]
agent = "domain-model-hub"
content = '''
docs/domain-model/index.md:47 — if not addressed: the hub no longer links the record concept file, so its terms have no source — I10

outcome: findings — a dropped link
'''

[[report]]
agent = "lang-gherkin"
content = '''
outcome: none — no scenario touched
'''

[expect]

[[expect.none]]
path = "docs/domain-model/index.md"

# The dropped line is known by its place and its source, which the
# generalist copies from the report, never by a word of its reason,
# which the generalist is free to choose.
[[expect.dropped]]
path = "docs/domain-model/index.md"
line = 47
source = "domain-model-hub"

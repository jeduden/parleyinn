component = "lang-markdown"
kind = "clean"
title = "a doc whose claims hold"

[[create]]
file = "docs/review-eval/running.md"
content = '''
---
summary: >-
  How the reviewer evaluation is run from the command line.
---
# Running the reviewer evaluation

`review-eval check` checks every case against every reviewer component
without a model call: each case applies to the tree and the review
bundle dispatches its component. `review-eval run --component NAME
--out DIR` then runs one component's cases on the model its front
matter names, and writes the scorecard under `DIR`.
'''

[expect]
outcome = ["sound", "nits"]

[[expect.none]]
path = "docs/review-eval/running.md"
severity = "blocking"

component = "lang-markdown"
kind = "clean"
title = "a doc whose claims hold"

[[create]]
file = "docs/review-eval/running.md"
content = '''
---
summary: >-
  How the reviewer evaluation is run from the command line.
---
# Running the reviewer evaluation

`review-eval check` calls no model. It applies each case to the
checkout and confirms the review bundle dispatches the one component
that case names. It also confirms that every component has a case of
each kind it needs.

`review-eval run --component NAME --out DIR` runs that component's
cases through the `claude` command line and writes `scorecard.json`
under `DIR`.
'''

[expect]
outcome = ["sound", "nits"]

[[expect.none]]
path = "docs/review-eval/running.md"
severity = "blocking"

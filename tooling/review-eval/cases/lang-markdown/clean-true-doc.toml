component = "lang-markdown"
kind = "clean"
title = "a doc whose claims hold"

[[create]]
file = "docs/review-eval/running.md"
content = '''
---
summary: >-
  Where the reviewer evaluation keeps each run of a case, and what it keeps.
---
# Reading the runs of a case

`cargo run -p review-eval -- run --component NAME --out DIR`, which
[Evaluating the reviewers](../review-evaluation.md) describes, keeps one
folder for each run of a case under `DIR/runs/`, named by the component,
the case and the run's number from 1, such as
`runs/lang-rust/clean-module/1/`.

That folder holds `log.jsonl`, the model's log, and `grade.txt`, whose
first line reads `passed` when the run passed and otherwise names what
failed. It holds `report.md` only when the component wrote a report.
'''

[expect]
outcome = ["sound", "nits"]

[[expect.none]]
path = "docs/review-eval/running.md"
severity = "blocking"

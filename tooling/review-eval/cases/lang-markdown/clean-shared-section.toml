component = "lang-markdown"
kind = "clean"
title = "a shared section changed at its source and in every copy"

# One sentence of the persona agents' shared section changes at its
# source and, as `mdsmith fix .` writes it, in each of the nine agent
# files that include it. The specialist's diff leaves out the copies
# that match their source: it must pass the change, never report a copy
# as a second source, and answer within its turns.

consent = "Approved for docs/agents/ and .claude/agents/ alike: docs/agents/persona-review.md and the nine persona agent files that include it now also note where a journey gets costly."

[[replace]]
file = "docs/agents/persona-review.md"
old = "   noisy or confusing.\n"
new = "   noisy, confusing or costly.\n"

[[replace]]
file = ".claude/agents/persona-agent.md"
old = "   noisy or confusing.\n"
new = "   noisy, confusing or costly.\n"


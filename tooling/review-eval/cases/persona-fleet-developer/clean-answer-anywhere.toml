# Answer a held request from anywhere

## Goal

A held request shows in the terminal the agent runs in, in the TUI and on a paired phone, and any of them answers it. The hook returns within its budget whether or not an answer came (I9); an unanswered request stays listed under Needs you. `parinn install` prints the exact settings change, asks once, and writes nothing on a no.

## Context

A developer with ten worktrees switches terminals all day and must not be slowed down, nor made to open a second tool to let an agent continue. Setup that changes configuration silently is the first reason such a developer uninstalls.

## Tasks

1. Show a held request in the terminal, the TUI and the phone.
2. Keep the hook inside its budget; list unanswered requests under Needs you.
3. Make install show its change and ask first (I7).
'''


# A case applies to main's tree, and the section this specialist checks
# is not there before the pull request that adds it. So each case here
# brings a file of its own and applies before that pull request and
# after it. The review bundle knows a section's specialist by the file's
# name without its number, so it hands this file to the same specialist.
# These cases hold the specialist to a section's file that is new; the
# cases derived from the section hold it to a change of the section.
# The file has a title and a case a name of its own, so neither meets
# the section's or a derived case's once the section is on main.
component = "srs-review-requirements"
kind = "defect"
title = "a requirement added with no scenario"

[[create]]
file = "docs/srs/10b-review-requirements.md"
content = '''
---
title: "Review notes"
summary: >-
  Notes on the review.
---
# Review notes

This file is part of ParleyInn. Each requirement is a heading with its id,
then its priority (Pri) and verification method (Ver) as a list, then its
text, one sentence a line.

## ENG-36

- Pri: P0
- Ver: T

The review MUST record each of its runs in the audit log.
'''

[expect]
outcome = ["findings"]
main_unread = true

[[expect.finding]]
path = "docs/srs/10b-review-requirements.md"
form = "linked"
ids = ["ENG-36"]

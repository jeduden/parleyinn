# A case applies to main's tree, and the section this specialist checks
# is not there before the pull request that adds it. So each case here
# brings a file of its own, under a name the review bundle also hands to
# this specialist, and applies before that pull request and in it. The
# cases derived from the section take their place once it is on main.
component = "srs-review-requirements"
kind = "defect"
title = "a requirement row added with no scenario"

[[create]]
file = "docs/srs/10b-review-requirements.md"
content = '''
---
title: "10.5 The review"
summary: >-
  A part of §10 on the review.
---
# 10.5 The review

This file is part of ParleyInn. The table lists: **ID** · **Pri** ·
**Requirement** · **Ver** (verification method).

| ID     | Pri | Requirement                                                   | Ver |
| ------ | --- | ------------------------------------------------------------- | --- |
| ENG-36 | P0  | The review MUST record each of its runs in the audit log.     | T   |
'''

[expect]
outcome = ["findings"]
main_unread = true

[[expect.finding]]
path = "docs/srs/10b-review-requirements.md"
form = "linked"
ids = ["ENG-36"]

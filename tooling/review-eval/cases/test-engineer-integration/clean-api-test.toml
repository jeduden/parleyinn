component = "test-engineer-integration"
kind = "clean"
title = "a test of the public API through a real file"

[[create]]
file = "tooling/review-eval/tests/published.rs"
content = '''
//! The published scorecard's text through a real file.

#![allow(
    clippy::unwrap_used,
    reason = "a test's helpers unwrap: a failure is the assertion"
)]

use std::fs;

use review_eval::published::{Line, merge, parse, render};
use testkit::TempDir;

fn line(component: &str, runs_passed: usize) -> Line {
    Line {
        component: component.to_owned(),
        model: "haiku".to_owned(),
        resolved: "claude-haiku-5-5".to_owned(),
        cases_passed: 3,
        cases: 3,
        runs_passed,
        runs: 6,
        slipped: 0,
        cost: 0.5,
        turns: 4.0,
        seconds: 30.0,
        hash: "0123456789abcdef".to_owned(),
    }
}

#[test]
fn a_publish_replaces_one_component_in_the_file_on_disk() {
    let dir = TempDir::new().unwrap();
    let path = dir.path().join("scorecard-v1.txt");
    fs::write(
        &path,
        render(&[line("lang-rust", 5), line("lang-shell", 6)]),
    )
    .unwrap();

    let existing = parse(&fs::read_to_string(&path).unwrap()).unwrap();
    fs::write(&path, render(&merge(existing, vec![line("lang-rust", 6)]))).unwrap();

    let back = parse(&fs::read_to_string(&path).unwrap()).unwrap();
    assert_eq!(back, vec![line("lang-rust", 6), line("lang-shell", 6)]);
}
'''

[expect]
outcome = ["sound", "nits"]

[[expect.none]]
path = "tooling/review-eval/tests/published.rs"
severity = "blocking"

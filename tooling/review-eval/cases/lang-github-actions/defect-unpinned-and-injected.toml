component = "lang-github-actions"
kind = "defect"
title = "an unpinned action and untrusted context in a run step"

[[create]]
file = ".github/workflows/greet.yml"
content = '''
name: Greet

on:
  pull_request:

permissions: {}

jobs:
  greet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Greet the author
        run: echo "Thanks for ${{ github.event.pull_request.title }}"
'''

[expect]
outcome = ["findings"]

# ENG-33 holds an action to a pinned sha and untrusted context out of a
# script, so a finding that cites it names the defect whatever its words;
# a requirement request, which cites no id, is known by its words.
[[expect.finding]]
path = ".github/workflows/greet.yml"
mentions_any = ["ENG-33", "pin", "sha", "inject", "${{", "env:", "untrusted"]

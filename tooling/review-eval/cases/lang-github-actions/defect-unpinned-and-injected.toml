component = "lang-github-actions"
kind = "defect"
title = "an unpinned action and untrusted context in a run step"

[[create]]
file = ".github/workflows/greet.yml"
content = '''
name: Greet

on:
  pull_request:

permissions: {}

jobs:
  greet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Greet the author
        run: echo "Thanks for ${{ github.event.pull_request.title }}"
'''

[expect]
outcome = ["findings"]

# ENG-33 holds an action to a pinned sha and untrusted context out of a
# script, and the specialist's checks name it, so the finding is a linked
# line that cites it, whatever its words. The checkout keeps no
# credential, so the fixture holds these two defects alone.
[[expect.finding]]
path = ".github/workflows/greet.yml"
form = "linked"
ids = ["ENG-33"]

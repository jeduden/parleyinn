# Catch up as a digest

## Goal

Catch up shows one paragraph per room, written by the model from the room's events, and nothing else: no event addresses and no links, since they clutter the text. Segments that failed to capture are left out of the digest so it stays short. Search covers the current run of each room; older runs are in the record for whoever wants to read it.

## Context

An owner coming back on Monday wants a quick read, not a list of pointers. A digest reads in a minute.

## Tasks

1. Write a one-paragraph digest per room from the model.
2. Leave event references and failed captures out.
3. Limit search to the current run.
'''


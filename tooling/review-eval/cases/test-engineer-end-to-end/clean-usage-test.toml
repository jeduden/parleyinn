component = "test-engineer-end-to-end"
kind = "clean"
title = "an isolated end-to-end test of the usage error"

[[create]]
file = "tooling/review-eval/tests/e2e_usage.rs"
content = '''
//! The executable refuses a wrong command line with its usage.

#![allow(
    clippy::unwrap_used,
    reason = "a test's helpers unwrap: a failure is the assertion"
)]

use std::process::Command;

use testkit::TempDir;

#[test]
fn a_wrong_command_line_exits_2_with_the_usage() {
    let home = TempDir::new().unwrap();
    let mut command = Command::new(env!("CARGO_BIN_EXE_review-eval"));
    command.env_clear().arg("--nope");
    testkit::isolate(&mut command, home.path());

    let out = command.output().unwrap();

    assert_eq!(out.status.code(), Some(2));
    assert!(String::from_utf8_lossy(&out.stderr).contains("usage: review-eval"));
}
'''

[expect]
outcome = ["sound", "nits"]

[[expect.none]]
path = "tooling/review-eval/tests/e2e_usage.rs"
severity = "blocking"

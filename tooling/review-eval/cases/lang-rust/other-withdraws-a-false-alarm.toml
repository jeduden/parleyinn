component = "lang-rust"
kind = "other"
title = "an unwrap added to a test-only module, stated on the diff and withdrawn once the module's place is read"

# The diff shows an unwrap in a file whose path does not say it is test
# code; the crate's lib.rs declares the module under `#[cfg(test)]`. A
# specialist that states what the diff shows and then checks its claim
# withdraws the finding; the report it ends with holds none.

[[replace]]
file = "tooling/review-run/src/fake.rs"
old = "/// The prompt `command` gives its agent.\npub(crate) fn prompt_of(command: &Command) -> String {\n    command.args.get(1).cloned().unwrap_or_default()\n}\n"
new = "/// The prompt `command` gives its agent.\npub(crate) fn prompt_of(command: &Command) -> String {\n    command.args.get(1).cloned().unwrap()\n}\n"

[expect]
outcome = ["none"]

[[expect.none]]
path = "tooling/review-run/src/fake.rs"
form = "linked"

[[expect.withdrawn]]
path = "tooling/review-run/src/fake.rs"

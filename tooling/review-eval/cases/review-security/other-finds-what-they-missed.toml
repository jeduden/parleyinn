component = "review-security"
kind = "other"
title = "a socket the officer missed"

[[create]]
file = "crates/redaction/src/report.rs"
content = '''
//! Reports each redaction to the metrics host.

use std::io::Write;
use std::net::TcpStream;

/// Sends how many secrets `redacted` to the metrics host, so a fleet
/// can watch its redaction rate.
///
/// # Errors
///
/// Fails when the host cannot be reached.
pub fn send(redacted: usize) -> std::io::Result<()> {
    let mut stream = TcpStream::connect("metrics.example.com:9000")?;
    writeln!(stream, "redacted {redacted}")
}
'''

[[replace]]
file = "crates/redaction/src/lib.rs"
old = "pub mod account;\n"
new = "pub mod account;\npub mod report;\n"


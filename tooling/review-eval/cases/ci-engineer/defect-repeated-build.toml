component = "ci-engineer"
kind = "defect"
title = "a job that builds the release core again instead of downloading it"

[[replace]]
file = ".github/workflows/ci.yml"
old = "      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2\n        with:\n          name: release-core\n          path: release-core\n      - name: Measure recall after compaction against the published result\n"
new = "      - name: Install pinned tools with mise\n        uses: ./.github/actions/setup-mise\n        with:\n          tools: \"rust\"\n          cache: true\n      - name: Build the release core again\n        run: cargo build --release --locked -p parinn-eval && mkdir -p release-core && cp target/release/parinn-eval release-core/\n      - name: Measure recall after compaction against the published result\n"

[expect]
outcome = ["findings"]

[[expect.finding]]
path = ".github/workflows/ci.yml"
mentions_any = ["build", "repeat", "artifact", "release-core", "release core"]

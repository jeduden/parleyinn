component = "ci-engineer"
kind = "defect"
title = "a failing step turned green with || true"

[[replace]]
file = ".github/workflows/ci.yml"
old = "          release-core/parinn-eval recall --published tooling/eval/recall-v1.txt | tee -a \"$GITHUB_STEP_SUMMARY\"\n"
new = "          release-core/parinn-eval recall --published tooling/eval/recall-v1.txt | tee -a \"$GITHUB_STEP_SUMMARY\" || true\n"

[expect]
outcome = ["findings"]

[[expect.finding]]
path = ".github/workflows/ci.yml"
form = "linked"
# The words a line on a failure that no longer fails its job may use:
# one run named it as a low recall that passes CI unseen.
mentions_any = ["|| true", "mask", "green", "fail", "pass", "succe", "exit", "swallow", "ignor", "hid", "unseen", "silent"]

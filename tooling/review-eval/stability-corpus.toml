# The stability probe's corpus (ENG-32): frozen pull-request states,
# each reviewed three times afresh by .github/workflows/stability.yml,
# whose verdict flip rate and finding overlap measure how stable the
# review is on an unchanged state. Each state is a merged pull request
# of this repository: `base` is the main commit it was opened against
# and `head` the commit it was reviewed at; the review diffs
# `base...head`.
#
# To add one, pick a small, recent merged pull request, read its two
# parents with `git log --merges --first-parent --format='%H %P' main`
# (the first parent is the base, the second the head), and add a state
# with a name of lowercase letters, digits and dashes. Each state costs
# three reviews per probe; keep the corpus small.

# A Rust change with its unit tests: the code generalist and its
# language and test-layer specialists.

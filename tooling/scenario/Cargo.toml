[package]
name = "scenario"
version = "0.0.0"
description = "Reads features/ into scenarios, keeps them in step with the SRS, and runs them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cucumber.workspace = true
srs.workspace = true

[dev-dependencies]
adr.workspace = true
administration.workspace = true
audit.workspace = true
drift.workspace = true
engineering.workspace = true
harness-contract.workspace = true
ingest.workspace = true
key.workspace = true
record.workspace = true
redaction.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
store.workspace = true
testkit.workspace = true
transcript.workspace = true

# The executable requirement matrix: every scenario under features/,
# run through cucumber-rs. It has its own main, so it is no libtest
# harness.
[[test]]
name = "bdd"
path = "tests/bdd/main.rs"
harness = false

[lints]
workspace = true

# ENG-02: see crates/parinn/Cargo.toml.
[package.metadata.parinn]
responsibility = "Reads features into scenarios, keeps them in step with the SRS and runs them"
may-depend-on = ["srs"]
may-dev-depend-on = ["adr", "administration", "audit", "drift", "engineering", "harness-contract", "ingest", "key", "record", "redaction", "store", "testkit", "transcript"]

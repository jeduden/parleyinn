[package]
name = "engineering"
version = "0.0.0"
description = "The checks behind the bound scenarios of SRS §10, Engineering quality"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "protection-check"
path = "src/main.rs"

[[bin]]
name = "license-check"
path = "src/license_check_main.rs"

[dependencies]
adr.workspace = true
benchmark.workspace = true
calibrate.workspace = true
drift.workspace = true
review-gate.workspace = true
scenario.workspace = true
serde_json.workspace = true
srs.workspace = true

[dev-dependencies]
testkit.workspace = true

[lints]
workspace = true

# ENG-02: see crates/parinn/Cargo.toml.
[package.metadata.parinn]
responsibility = "Checks the repository against the requirements of SRS section 10 for the bound scenarios"
may-depend-on = ["adr", "benchmark", "calibrate", "drift", "review-gate", "scenario", "srs"]
may-dev-depend-on = ["testkit"]

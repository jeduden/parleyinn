[package]
name = "s8bench"
version = "0.0.0"
edition = "2024"
publish = false

# The store crate S2 measured, at the same version, and the JSON reader
# for the committed sample and hook inputs.
[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"

# Standalone: kept out of the parinn workspace.
[workspace]

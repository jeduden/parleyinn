# The Cargo workspace (ENG-02): the product's crates under crates/,
# the `parinn` core executable and the library crates it links, and the
# repository tooling under tooling/. The product's other crates join it
# as their plans land.
#
# Every external dependency is declared once, in
# [workspace.dependencies], and each crate takes it with
# `workspace = true`. The ENG-18 scenario reads the direct
# dependencies through `cargo metadata`, and each needs an accepted
# ADR under docs/adr.
[workspace]
resolver = "3"
members = ["crates/*", "tooling/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
cucumber = "0.23.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
# SQLite and FTS5 compiled in, extension loading compiled out through
# LIBSQLITE3_FLAGS in .cargo/config.toml (ADR-2610110553).
# The macOS Keychain, no TLS features (ADR-2610171300).
security-framework = { version = "3.7.0", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
# DPAPI, the last error and the registry, for the platform shim alone (ADR-2610171300, ADR-2610171301).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry"] }
# Linear-time matching, Unicode classes and the literal fast paths
# kept, nothing else (ADR-2610161200).
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
# The events and their macros only: no proc-macro attributes, no log
# bridge (ADR-2610161201).
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Parsing only: no writer, the nesting limit kept (ADR-2610152132).
toml = { version = "1.1.5", default-features = false, features = ["std", "parse", "serde"] }

administration = { path = "crates/administration" }
allowed_root = { path = "crates/allowed_root" }
audit = { path = "crates/audit" }
configuration = { path = "crates/configuration" }
platform = { path = "crates/platform" }
envelope = { path = "crates/envelope" }
hook = { path = "crates/hook" }
ingest = { path = "crates/ingest" }
key = { path = "crates/key" }
mcp = { path = "crates/mcp" }
provenance = { path = "crates/provenance" }
record = { path = "crates/record" }
redaction = { path = "crates/redaction" }
room = { path = "crates/room" }
repository = { path = "crates/repository" }
search = { path = "crates/search" }
store = { path = "crates/store" }
structured_log = { path = "crates/structured_log" }
transcript = { path = "crates/transcript" }

adr = { path = "tooling/adr" }
benchmark = { path = "tooling/benchmark" }
calibrate = { path = "tooling/calibrate" }
drift = { path = "tooling/drift" }
coverage = { path = "tooling/coverage" }
engineering = { path = "tooling/engineering" }
finding-ledger = { path = "tooling/finding-ledger" }
harness-contract = { path = "tooling/harness-contract" }
review-gate = { path = "tooling/review-gate" }
scenario = { path = "tooling/scenario" }
srs = { path = "tooling/srs" }
testkit = { path = "tooling/testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Errors are returned, never panicked (CLAUDE.md). clippy.toml lets a
# test unwrap, expect and panic.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Small functions (CLAUDE.md), held at build time: these complexity
# lints are off by default, and clippy.toml sets the ceilings they hold
# each function to. A site that must exceed one says so with an
# `expect` and a reason, under review.
cognitive_complexity = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"

# The test pyramid's policy, which `cargo run -p coverage` enforces
# (ENG-11). It measures line coverage per test layer: unit (the tests
# beside the code), integration (a crate's tests/ targets) and
# end-to-end (the bdd scenario runner and every tests/e2e* target).
#
# - Unit tests prove every function and module directly: each crate
#   keeps 99% of its lines covered by unit tests alone. An executable's
#   entry point (entry-points) is proven end to end instead, so the
#   unit and integration measures leave it out.
# - Integration and end-to-end tests guard behaviour: requirements and
#   real boundaries. They are measured and reported, with no floor.
# - `all`, every test layer together, holds each crate at 100%.
# - `pyramid` fails a run whose test counts invert the pyramid: more
#   integration than unit tests, or more end-to-end than integration.
#
# Unit-test files (tests.rs) and every tests/ directory are left out of
# the measure, so the numbers count shipped code. A crate's own floors
# go under [workspace.metadata.coverage.crates.<name>.floors];
# ENG-11's floors for the product crates join that way as they land.
[workspace.metadata.coverage]
exclude = '(^|/)tests\.rs$'
entry-points = ["src/main.rs"]
floors = { all = 100, unit = 99 }
pyramid = true

# Release builds: one codegen unit and no debug information or
# symbols.
[profile.release]
codegen-units = 1
lto = "thin"
strip = true

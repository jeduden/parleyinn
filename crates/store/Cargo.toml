[package]
name = "store"
version = "0.0.0"
description = "The store: writer logs and seats in store.db, appended a transaction at a time"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
record.workspace = true
rusqlite.workspace = true
search.workspace = true
serde_json.workspace = true

[dev-dependencies]
testkit.workspace = true

[lints]
workspace = true

# ENG-02: see crates/parinn/Cargo.toml.
[package.metadata.parinn]
responsibility = "Keeps the record's writer logs and seats in store.db"
may-depend-on = ["record", "search"]
may-dev-depend-on = ["testkit"]

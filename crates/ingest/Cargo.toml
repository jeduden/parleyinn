[package]
name = "ingest"
version = "0.0.0"
description = "parinn ingest: a transcript read into an ingest seat's writer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
administration.workspace = true
key.workspace = true
provenance.workspace = true
record.workspace = true
redaction.workspace = true
serde_json.workspace = true
store.workspace = true
transcript.workspace = true

[dev-dependencies]
rusqlite.workspace = true
testkit.workspace = true

[lints]
workspace = true

# ENG-02: see crates/parinn/Cargo.toml.
[package.metadata.parinn]
responsibility = "Reads harness transcripts into the record"

[package]
name = "parinn"
version = "0.0.0"
description = "The ParleyInn core executable: the hook handlers, the MCP server and the CLI so far"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
administration.workspace = true
allowed_root.workspace = true
audit.workspace = true
configuration.workspace = true
hook.workspace = true
ingest.workspace = true
key.workspace = true
mcp.workspace = true
record.workspace = true
redaction.workspace = true
repository.workspace = true
serde_json.workspace = true
store.workspace = true
structured_log.workspace = true
tracing.workspace = true

[dev-dependencies]
rusqlite.workspace = true
testkit.workspace = true

[lints]
workspace = true

# ENG-02: the one thing this crate does, and the workspace crates it may
# depend on (a product crate never depends on tooling, tests aside). The
# architecture check reads both.
[package.metadata.parinn]
responsibility = "Runs the core executable: the hook handlers, the MCP server and the CLI"
may-depend-on = ["administration", "allowed_root", "audit", "configuration", "hook", "ingest", "key", "mcp", "record", "redaction", "repository", "store", "structured_log"]
may-dev-depend-on = ["testkit"]

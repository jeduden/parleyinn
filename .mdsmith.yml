# mdsmith configuration for ParleyInn.
#
# Started from `frit init --mdsmith` (the plan/proto.md schema and the
# PLAN.md catalog it governs), extended with frit's skill kind and a
# kind for the SRS under docs/srs. Per CLAUDE.md, change this file only
# with the maintainer's explicit consent.

front-matter: true

rules:
  line-length:
    max: 80
    exclude:
      - code-blocks
      - tables
      - urls
  heading-style:
    style: atx
  heading-increment: true
  first-line-heading:
    level: 1
  no-duplicate-headings: true
  no-trailing-spaces: true
  no-hard-tabs: true
  no-multiple-blanks:
    max: 1
  single-trailing-newline: true
  fenced-code-style:
    style: backtick
  fenced-code-language: true
  no-bare-urls: true
  blank-line-around-headings: true
  blank-line-around-lists: true
  blank-line-around-fenced-code: true
  list-indent:
    spaces: 2
  table-format:
    pad: 1
  catalog:
    pad: 1
  no-trailing-punctuation-in-heading: true
  no-emphasis-as-heading: true
  cross-file-reference-integrity:
    strict: true
  # A stray Markdown file anywhere else fails the lint: docs live
  # under docs/, plans under plan/, skills under .claude/skills/,
  # subagents under .claude/agents/, research under research/.
  directory-structure:
    allowed:
      - "."
      - "docs/**"
      - "plan/**"
      - ".claude/skills/**"
      - ".claude/agents/**"
      - "research/**"
  # Plan and ADR ids are the minute-precision UTC creation time, so
  # two machines can allocate one without coordinating. Uniqueness is
  # what keys a plan or a decision; the ADR- prefix keeps the two id
  # spaces apart.
  unique-frontmatter:
    field: id
    include:
      - "plan/*.md"
      - "plan/*/plan.md"
      - "docs/adr/*.md"
      - "docs/use-cases/UC-*.md"
    exclude:
      - "plan/proto.md"

kinds:
  srs:
    # The Software Requirements Specification, split one file per
    # section. Its requirement tables are normative and dense by
    # design — every row a MUST with its priority, verification method
    # and traces — and internal/srs parses them, so the readability
    # rules that would push those rows into prose step aside. Every
    # section carries a summary for the CLAUDE.md catalog.
    path-pattern: "docs/srs/*.md"
    rules:
      table-readability: false
      paragraph-readability: false
      required-frontmatter:
        fields: [summary]
  doc:
    # Every other doc carries the one-line summary the CLAUDE.md
    # catalog lists, so an agent reads the index and opens only what
    # a task touches.
    rules:
      required-frontmatter:
        fields: [summary]
  adr:
    # One architecture decision record per file (ENG-26), named for
    # its id. New ids are the minute-precision UTC time, like plan
    # ids, so parallel agents never collide. The front matter is flat
    # scalars only: internal/adr reads it without a YAML library, and
    # a dependency decision keeps its modules in a Decision table
    # instead (ENG-18). The ENG-26 scenario checks the same shape.
    path-pattern: "docs/adr/ADR-*.md"
    schema:
      frontmatter:
        id: '=~"^ADR-[0-9]+$"'
        title: nonEmpty
        status: '"proposed" | "accepted" | "superseded"'
        summary: nonEmpty
        "scope?": '"dependencies"'
        "superseded-by?": '=~"^ADR-[0-9]+$"'
      closed: false
      sections:
        - heading: null
        - heading: "Context"
        - heading: "Decision"
        - heading: "Alternatives"
        - heading: "Consequences"
  use-case:
    # One pending use case per file under docs/use-cases, front matter
    # and a title only: the docs/use-cases.md index generates its table
    # from the front matter. The summary is the use case itself, one
    # sentence of at most 40 words, so an entry stays a use case and
    # never grows into a design.
    path-pattern: "docs/use-cases/UC-*.md"
    schema:
      filename: "UC-[0-9][0-9][0-9].md"
      frontmatter:
        id: '=~"^UC-[0-9]{3}$"'
        title: nonEmpty
        summary: '=~"^[^ ]+( [^ ]+){0,39}$" & !~"[.!?;] "'
        personas: '=~"^U[1-9](, U[1-9])*$"'
        milestone: '=~"^(M[1-9]( to M[1-9])?|unplanned)$"'
        status: '"pending" | "specified" | "shipped"'
        "requirements?": '=~"^[A-Z]+-[0-9]{2}(, [A-Z]+-[0-9]{2})*$"'
      closed: true
      sections:
        - heading: null
    rules:
      max-file-length:
        max: 20
  skill:
    # The plan-* skills `frit skills` writes into .claude/skills. A
    # skill loads into a working session, so every line is paid for:
    # the same caps frit applies to the skills it ships.
    path-pattern: ".claude/skills/*/SKILL.md"
    rules:
      required-frontmatter:
        fields: [name, description]
      table-readability: false
      max-file-length:
        max: 65
      token-budget:
        mode: heuristic
        max: 650
      paragraph-structure:
        max-sentences: 6
        max-words-per-sentence: 35
      max-section-length:
        per-level:
          1: 10
          2: 40
  agent:
    # Subagents under .claude/agents: one perspective each, such as a
    # persona reviewer. Skills hold objective procedures; agents hold
    # subjective viewpoints. A subagent's file loads into its own
    # context, not the session's, so its caps are looser than a skill's.
    # Every agent here reviews: it reads, and never writes, runs or
    # fetches.
    path-pattern: ".claude/agents/*.md"
    schema:
      frontmatter:
        name: '=~"^[a-z][a-z-]*$"'
        description: nonEmpty
        tools: '"Read, Grep, Glob"'
    rules:
      required-frontmatter:
        fields: [name, description]
      table-readability: false
      max-file-length:
        max: 90
      token-budget:
        mode: heuristic
        max: 1100
      paragraph-structure:
        max-sentences: 6
        max-words-per-sentence: 35
  persona:
    # A persona reviewer carries the same sections every time, so a
    # persona's journeys and its reasons to give up cannot be dropped
    # quietly: they are what requirement work tends to lose.
    path-pattern: ".claude/agents/persona-*.md"
    schema:
      filename: "persona-*.md"
      frontmatter:
        name: '=~"^persona-[a-z-]+$"'
        description: nonEmpty
        tools: '"Read, Grep, Glob"'
      closed: false
      sections:
        - heading: null
        - heading: "Who you are"
        - heading: "What you need"
        - heading: "Your journeys"
        - heading: "When you give up"
        - heading: "How you review"
  domain-model:
    # docs/domain-model/index.md is the hub of the domain model: its
    # intro, the catalog of concept files, and the parts that span every
    # group. Its sections cannot be dropped quietly.
    path-pattern: "docs/domain-model/index.md"
    schema:
      closed: true
      sections:
        - heading: null
        - heading: "Concepts"
        - heading: "Relations"
        - heading: "Names follow the model"
        - heading: "Not ParleyInn concepts"
        - heading: "Changing the model"
    rules:
      token-budget:
        mode: heuristic
        max: 3000
  domain-model-concepts:
    # One group of the domain model's concepts per file, one concept per
    # list item. Each carries the title, order and summary the hub's
    # catalog reads, and holds no sub-sections.
    path-pattern: "docs/domain-model/*.md"
    schema:
      frontmatter:
        title: nonEmpty
        order: nonEmpty
        summary: nonEmpty
      closed: true
      sections:
        - heading: null
    rules:
      max-file-length:
        max: 250
      token-budget:
        mode: heuristic
        max: 3000
  domain-model-agent:
    # The domain-model agent holds instructions only; the model itself
    # is docs/domain-model/. Its name is pinned to its file, and its
    # sections (when it is consulted, how it reviews a change, how it
    # reviews a change to the model itself, and how it reports) cannot
    # be dropped quietly.
    path-pattern: ".claude/agents/domain-model.md"
    schema:
      filename: "domain-model.md"
      frontmatter:
        name: '"domain-model"'
        description: nonEmpty
        tools: '"Read, Grep, Glob"'
      closed: true
      sections:
        - heading: null
        - heading: "When you are consulted"
        - heading: "How you review"
        - heading: "When the model changes"
        - heading: "How you report"
  proto:
    # proto.md leads with directives and placeholder headings rather
    # than real content; the structural rules step aside for it.
    rules:
      first-line-heading: false
      heading-increment: false
      blank-line-around-headings: false
      no-duplicate-headings: false
      no-emphasis-as-heading: false
      cross-file-reference-integrity: false
      paragraph-readability: false
      paragraph-structure: false
  plan:
    # The folder shape's `*/plan.md` is loose by design, unlike the
    # flat shape's id-prefixed name: frit's own doctor id-sync check
    # is what catches a folder not named for its id, not this pattern.
    path-pattern: "plan/{proto.md,[0-9][0-9]*_*.md,*/plan.md}"
    rules:
      required-structure:
        schema: plan/proto.md
  phase-spec:
    # A folder plan's own phase-N.md spec: the working brief `frit
    # phase` bundles for a session. Freeform prose — RED, GREEN and
    # the gate are paragraphs, the way an inline `## Phase N` section
    # already writes them, not headings — so the rules that assume a
    # heading opener step aside, and the schema only pins the
    # filename.
    path-pattern: "plan/*/phase-*.md"
    schema:
      filename: "phase-*.md"
    rules:
      first-line-heading: false
      heading-increment: false
      token-budget:
        mode: heuristic
        max: 800
  phase-record:
    # A phase's living record: parked notes while the phase stays
    # open, a `## Handoff` heading once it closes — level 2 by
    # convention, so the same structural rules step aside here too.
    # `frit phase` finds Handoff itself by walking the heading, not
    # this schema, which only pins the filename.
    path-pattern: "plan/*/phase-*.result.md"
    schema:
      filename: "phase-*.result.md"
    rules:
      first-line-heading: false
      heading-increment: false
      paragraph-readability: false
      paragraph-structure: false
      token-budget:
        mode: heuristic
        max: 900

# Order matters: proto applies first so plan/proto.md also picks up the
# plan kind, whose required-structure.schema points back at the file
# itself. That marks it as its own schema, which stops MDS020 firing on
# the <?require?> inside it.
kind-assignment:
  - glob: ["docs/**/*.md", "!docs/srs/*.md", "!docs/adr/*.md"]
    kinds: [doc]
  - glob: ["docs/use-cases/UC-*.md"]
    kinds: [use-case]
  - glob: ["docs/domain-model/index.md"]
    kinds: [domain-model]
  - glob: ["docs/domain-model/*.md", "!docs/domain-model/index.md"]
    kinds: [domain-model-concepts]
  - glob: ["docs/adr/*.md"]
    kinds: [adr]
  - glob: ["docs/srs/*.md"]
    kinds: [srs]
  - glob: [".claude/skills/*/SKILL.md"]
    kinds: [skill]
  - glob: [".claude/agents/*.md"]
    kinds: [agent]
  - glob: [".claude/agents/persona-*.md"]
    kinds: [persona]
  - glob: [".claude/agents/domain-model.md"]
    kinds: [domain-model-agent]
  - glob: ["**/proto.md"]
    kinds: [proto]
  - glob: ["plan/*.md", "plan/*/plan.md"]
    kinds: [plan]
  - glob: ["plan/*/phase-*.md", "!plan/*/phase-*.result.md"]
    kinds: [phase-spec]
  - glob: ["plan/*/phase-*.result.md"]
    kinds: [phase-record]

overrides:
  # A plan folder's companion files (research, fixtures, diagrams) are
  # freeform; plan.md keeps the plan kind and its full checks, and
  # phase-N.md/phase-N.result.md keep their own kinds above, so both
  # are excluded here.
  - glob: ["plan/*/*.md", "!plan/*/plan.md", "!plan/*/phase-*.md"]
    rules:
      first-line-heading: false
      heading-increment: false
      paragraph-readability: false
      paragraph-structure: false
      max-file-length: false
      required-structure: false
      # Companion analyses such as requirement traces are wide
      # matrices, as research notes are.
      table-readability: false
      token-budget: false

  # Companion subfolders of a plan (for example ux/) hold working
  # design drafts, written and reviewed like research notes.
  - glob: ["plan/*/*/**/*.md"]
    rules:
      first-line-heading: false
      heading-increment: false
      paragraph-readability: false
      paragraph-structure: false
      max-file-length: false
      cross-file-reference-integrity: false
      required-structure: false
      no-duplicate-headings: false
      line-length: false
      no-emphasis-as-heading: false
      fenced-code-language: false
      table-readability: false
      token-budget: false

  # Research reports and their raw notes are kept verbatim as evidence:
  # the readability and length rules that shape docs step aside, and
  # links point outward, so cross-file integrity is not checked.
  - glob: ["research/**/*.md"]
    rules:
      first-line-heading: false
      heading-increment: false
      paragraph-readability: false
      paragraph-structure: false
      max-file-length: false
      cross-file-reference-integrity: false
      required-structure: false
      no-duplicate-headings: false
      line-length: false
      no-emphasis-as-heading: false
      fenced-code-language: false
      table-readability: false
      token-budget: false

ignore:
  - ".github/**"
